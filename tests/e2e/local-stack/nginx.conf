# Local validation TLS proxy.
#
# The phone app refuses plain HTTP by design (`normalizeBaseUrl` in the app's
# importerClient.ts rejects http:// outright), so validating on a real emulator
# needs the portal behind TLS. This terminates TLS on 8443 with the locally
# generated cert and forwards to the portal container.
#
# `10.0.2.2` is the host address as seen from inside the Android emulator, and
# it is a SAN on the generated certificate.

events {}

http {
  server {
    listen 8443 ssl;
    server_name 10.0.2.2;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_pass http://portal:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
