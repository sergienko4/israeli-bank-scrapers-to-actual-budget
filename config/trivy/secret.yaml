# Trivy secret scanning configuration
# https://trivy.dev/docs/v0.69/guide/scanner/secret/
#
# IMPORTANT: this file must be loaded via `--secret-config` (env
# TRIVY_SECRET_CONFIG), never via `--config` / the trivy-action
# `trivy-config` input. `--config` is Trivy's *general* configuration
# loader: it accepts this file without error, does not recognise the
# `allow-rules` key, and silently ignores every rule below — the scan then
# reports the very false positives these rules exist to suppress.
# See .github/actions/security/trivy-scan/action.yml.
#
# All built-in rules are enabled by default.
# allow-rules below suppress known false positives in the Docker image.

allow-rules:
  # Documentation files inside npm's bundled packages contain example credentials
  # (e.g. README files showing API key format examples) — not real secrets.
  - id: allow-npm-internal-docs
    description: Skip documentation files inside npm's own bundled node_modules
    path: usr/local/lib/node_modules/npm/.*\.(md|txt|rst|html|json)

  # The app's node_modules contain README files with example tokens/keys.
  - id: allow-app-node-modules-docs
    description: Skip documentation files inside app node_modules
    path: app/node_modules/.*\.(md|txt|rst|html)

  # Camoufox bundles uBlock Origin, whose addon folder ships third-party
  # threat-intelligence feeds — notably abuse.ch's URLhaus "Online Malicious
  # URL Blocklist" (https://gitlab.com/malware-filter/urlhaus-filter). Every
  # line is a *known-malicious* URL, and attacker URLs routinely carry
  # `jwt=` / `token=` query parameters, which the secret scanner then matches.
  #
  # Those strings are published threat data, not our credentials: there is
  # nothing to rotate, and the feed regenerates every 12 hours, so matches
  # appear and vanish between builds with no change on our side. Suppress the
  # class rather than let recurring noise mask a genuine leak.
  #
  # Both paths are the same file: the Dockerfile stages the cache at
  # /tmp/camoufox-precache and copies it to /home/node/.cache/camoufox.
  - id: allow-camoufox-addon-feeds
    description: Skip third-party blocklists bundled with the Camoufox uBO addon
    path: (home/node/\.cache/camoufox|tmp/camoufox-precache)/addons/.*\.txt
