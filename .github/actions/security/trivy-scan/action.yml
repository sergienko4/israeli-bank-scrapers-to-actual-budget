name: Trivy Scan
description: Scan a Docker image once, gate on fixable CRITICAL/HIGH vulnerabilities and on any secret, and upload SARIF to the Security tab

inputs:
  image-ref:
    description: Docker image reference to scan
    required: true

runs:
  using: composite
  steps:
    # One scan feeds the SARIF upload and both gates below. Each extra
    # trivy-action pass re-read the whole image, so three passes cost three
    # scans of the same layers.
    #
    # Every severity is kept: the SARIF carries them all, as the old SARIF
    # pass did (trivy-action drops the severity filter for SARIF), and the
    # gates pick their own. `ignore-unfixed` applies to vulnerabilities
    # only, so the secret gate still sees every detection.
    #
    # The secret allow-rules in config/trivy/secret.yaml reach the scanner
    # through TRIVY_SECRET_CONFIG, *not* the action's `trivy-config` input.
    # `trivy-config` maps to Trivy's `--config` (general configuration),
    # which does not understand the `allow-rules` key: it parses without
    # error and silently ignores every rule. Only `--secret-config` /
    # TRIVY_SECRET_CONFIG feeds the secret scanner.
    - name: Scan the image for vulnerabilities and secrets
      id: scan
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SECRET_CONFIG: config/trivy/secret.yaml
      with:
        image-ref: ${{ inputs.image-ref }}
        format: json
        output: trivy-results.json
        exit-code: '0'
        severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
        ignore-unfixed: true
        scanners: vuln,secret
        vuln-type: os,library
        skip-dirs: root/.npm

    # trivy-action leaves the trivy binary on PATH (setup-trivy adds it).
    - name: Convert the report to SARIF
      id: sarif
      if: ${{ !cancelled() }}
      shell: bash
      run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

    - name: Upload SARIF to Security tab
      id: upload
      uses: github/codeql-action/upload-sarif@v4
      if: ${{ !cancelled() }}
      with:
        sarif_file: trivy-results.sarif

    # Both gates read the report with `jq -n input` and accept it only as a
    # Trivy report of this image: an object naming IMAGE_REF as its
    # container_image artifact, with the image ID Trivy read. A missing,
    # empty, truncated or unrelated report fails them instead of reading as
    # "no findings". With that proven, a report without `Results` (nothing
    # to report) passes.
    #
    # Every step after the scan runs even when an earlier one failed, so a
    # failed SARIF upload cannot hide a gate's result and one run reports
    # both gates. A failed scan cannot slip through: its missing or partial
    # report fails both gates. `!cancelled()`, not `always()`: a cancelled
    # run stops here instead of uploading and gating a scan it cut short.

    # Gate 1: vulnerabilities. Deliberately capped at CRITICAL/HIGH: lower
    # severities are dominated by unfixable upstream OS CVEs that would make
    # the gate unactionable. The scan's `ignore-unfixed` keeps it to CVEs we
    # can resolve.
    #
    # The table is drawn from a copy without `Secrets`: Trivy renders a
    # secret with the source lines around it, which gate 2 keeps out of the
    # log.
    - name: Fail on CRITICAL or HIGH vulnerabilities
      id: vulns
      if: ${{ !cancelled() }}
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        report=trivy-results.json
        if ! count=$(jq -n --arg image "$IMAGE_REF" 'input
            | if type == "object" and .ArtifactType == "container_image" and .ArtifactName == $image
                and (.Metadata.ImageID | type == "string" and length > 0)
              then . else error("not a Trivy report of \($image)") end
            | [.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")]
            | length' "$report"); then
          echo "::error::No usable Trivy report of the image in ${report}"
          exit 1
        fi
        if [ "$count" -eq 0 ]; then
          echo "No fixable CRITICAL or HIGH vulnerabilities."
          exit 0
        fi
        jq 'del(.Results[]?.Secrets)' "$report" > trivy-vulns.json
        trivy convert --format table --severity CRITICAL,HIGH trivy-vulns.json
        echo "::error::${count} fixable CRITICAL or HIGH vulnerabilities (table above)."
        exit 1

    # Gate 2: secrets. Fails on ANY severity, by design.
    #
    # Trivy grades most secret rules MEDIUM (e.g. `jwt-token`), so a
    # CRITICAL/HIGH gate would let them through while the SARIF upload still
    # published them to the Security tab: reported, never blocking. Severity
    # is a useful lever for CVE triage; for a credential in a shipped image
    # it is not, so every detection breaks the build here. False positives
    # are suppressed by rule in config/trivy/secret.yaml rather than by
    # raising this threshold.
    #
    # The log names each finding by rule, file and line only: the matched
    # text never reaches it, and the fixed prefix plus the JSON-quoted path
    # keep an image path from starting a workflow command.
    - name: Fail on any detected secret
      id: secrets
      if: ${{ !cancelled() }}
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        report=trivy-results.json
        if ! found=$(jq -nr --arg image "$IMAGE_REF" 'input
            | if type == "object" and .ArtifactType == "container_image" and .ArtifactName == $image
                and (.Metadata.ImageID | type == "string" and length > 0)
              then . else error("not a Trivy report of \($image)") end
            | .Results[]? | .Target as $target | .Secrets[]?
            | "secret: \(.RuleID) (\(.Severity)) in \($target | tojson) line \(.StartLine)"' "$report"); then
          echo "::error::No usable Trivy report of the image in ${report}"
          exit 1
        fi
        if [ -z "$found" ]; then
          echo "No secrets detected."
          exit 0
        fi
        printf '%s\n' "$found"
        echo "::error::$(grep -c '^secret: ' <<< "$found") secret(s) detected (listed above)."
        exit 1
