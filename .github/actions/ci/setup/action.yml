name: Setup CI
description: Setup Node.js with npm cache and install dependencies

inputs:
  node-version:
    description: Node.js version
    default: '26.x'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    # The provider's postinstall patches the playwright-core that drives
    # Camoufox but exits 0 even when a patch cannot apply. --strict fails
    # instead, so an install the browser cannot run on stops here.
    - name: Prove the browser patches applied
      shell: bash
      run: npm run -s camoufox:patch-check
