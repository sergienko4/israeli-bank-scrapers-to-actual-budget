name: Build Docker Image
description: |
  Composite that consolidates the Docker build sequence used by pr.yml (trivy),
  release.yml (one native build per architecture, pushed by digest), and
  _e2e-suite.yml. Steps:
    1. Restore Camoufox cache (composite)
    2. Set up Buildx
    3. Build (and optionally push) the image
    4. Report the runner's free disk, even when the build fails
  The runner starts with ~86 GB free and a release build leg still has
  ~78 GB left after its build, so no step deletes preinstalled toolchains
  to make room.
  The provenance and sbom inputs were added for an earlier Docker Hub
  push leg. release.yml now copies the GHCR image to Docker Hub with
  regctl, so no caller sets them and their empty defaults pass through to
  build-push-action@v7's own defaults. No build uses a remote layer cache:
  exporting it cost more than the layers it saved.

inputs:
  tag:
    description: Image tag (single tag) or comma-separated list. Used as `tags:` for build-push-action.
    required: true
  platforms:
    description: Target platforms (comma-separated). Default linux/amd64 for fast PR builds.
    default: linux/amd64
  push:
    description: Push the image to the registry (true/false).
    default: 'false'
  load:
    description: Load the image into the local docker daemon (true/false). Mutually exclusive with multi-arch push.
    default: 'true'
  push-by-digest:
    description: |
      Push the image untagged, by digest only (true/false). `tag` must then
      be the bare image name and `push` is ignored. The release workflow
      builds each architecture this way and joins the digests into one
      tagged index afterwards.
    default: 'false'
  labels:
    description: Optional OCI labels (multi-line string, as emitted by docker/metadata-action).
    default: ''
  provenance:
    description: |
      SLSA provenance attestation. `false` disables; `mode=min` / `mode=max`
      enables explicitly. Empty string keeps build-push-action@v7's default
      (mode=max on multi-platform builds, mode=min otherwise).
    default: ''
  sbom:
    description: |
      SBOM attestation embedded in the image index. `false` disables.
      Empty string keeps build-push-action@v7's default. The repo-level
      SBOM attached to the GitHub release via `anchore/sbom-action` is
      independent of this input.
    default: ''

outputs:
  digest:
    description: Image digest (sha256:...) that build-push-action reports.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/docker/camoufox-cache
    - uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push-by-digest == 'true' && 'false' || inputs.push }}
        load: ${{ inputs.load }}
        outputs: ${{ inputs.push-by-digest == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || '' }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tag }}
        labels: ${{ inputs.labels }}
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom }}
        build-args: |
          SKIP_BROWSER_FETCH=true
          APT_CACHE_BUST=${{ github.run_id }}

    - name: Report free disk
      if: always()
      shell: bash
      run: df -h /
