name: Camoufox Cache
description: >
  Install the Camoufox browser build pinned in config/camoufox-pin.json into
  ~/.cache/camoufox, cached with actions/cache under a key that changes with
  the pin, the installer and the runner architecture, so a cache never serves
  another build.
  scripts/camoufox-fetch.mjs downloads the pinned asset URL directly (no
  GitHub API call, so no rate limit) and checks its SHA-256. It is then
  copied into .camoufox-cache/ for the Docker build context.

runs:
  using: composite
  steps:
    - name: Restore Camoufox cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/camoufox
        key: camoufox-pin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/camoufox-pin.json', 'scripts/camoufox-*.mjs') }}

    - name: Check the cached Camoufox build
      id: check
      shell: bash
      run: |
        # --verify reads only the pin and the install records, so it needs no
        # node_modules; jobs that skip ci/setup only install on a cache miss.
        if CAMOUFOX_INSTALL_DIR="$HOME/.cache/camoufox" node scripts/camoufox-fetch.mjs --verify; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -d node_modules/@hieutran094/camoufox-js ]; then
          echo "deps=true" >> "$GITHUB_OUTPUT"
        else
          echo "deps=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies for the Camoufox installer
      if: steps.check.outputs.installed != 'true' && steps.check.outputs.deps != 'true'
      uses: ./.github/actions/ci/setup

    - name: Install the pinned Camoufox build
      if: steps.check.outputs.installed != 'true'
      shell: bash
      run: CAMOUFOX_INSTALL_DIR="$HOME/.cache/camoufox" node scripts/camoufox-fetch.mjs

    - name: Inject Camoufox into Docker build context
      shell: bash
      run: cp -r ~/.cache/camoufox/* .camoufox-cache/
