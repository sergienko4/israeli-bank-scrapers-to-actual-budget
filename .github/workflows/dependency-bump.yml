# Opens a ready-to-review bump pull request for a single npm package.
#
# Dependabot already watches this repository daily and stays the default path.
# A daily cadence is too slow for @sergienko4/israeli-bank-scrapers, though:
# that package is what breaks when a bank changes its site, so an upstream fix
# is usually needed in a release the same evening. A freshly published version
# also takes time to surface in the registry index Dependabot reads, so a scan
# running shortly after a publish can miss it and leave the bump waiting for
# the next day.
#
# This workflow is the on-demand path for those cases, and for any maintainer
# whose network cannot reach the npm registry: the install runs on a runner,
# where npm resolves and verifies the tarball itself rather than trusting a
# hand-edited lockfile.
#
#   gh workflow run dependency-bump.yml -f version=8.6.6
#   gh workflow run dependency-bump.yml -f package=pino -f version=10.4.0
#
name: Dependency bump

on:
  workflow_dispatch:
    inputs:
      package:
        description: "npm package to bump"
        required: true
        default: "@sergienko4/israeli-bank-scrapers"
      version:
        description: "Exact version or dist-tag, e.g. 8.6.6 or latest"
        required: true
        default: "latest"
      type:
        description: "Commit type: fix ships a release; chore is for devDependencies only"
        required: true
        type: choice
        options: [fix, chore]
        default: fix

# The job writes through RELEASE_TOKEN, so the workflow token stays read-only.
permissions:
  contents: read

concurrency:
  group: dependency-bump-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump ${{ inputs.package }} to ${{ inputs.version }}
    runs-on: ubuntu-latest
    # `prepare` runs husky, so installing here would also install the local git
    # hooks and make this job re-run all 15 of them against its own commit and
    # push. The pull request's CI is the validation; a hook failing here would
    # end the run without leaving a pull request to look at.
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          # No PAT here, and no persisted credentials: `npm install` below runs
          # approved install scripts, and any credential left in .git/config
          # would be usable by them to push. The PAT is introduced only in the
          # final step, which needs it because a pull request opened with
          # GITHUB_TOKEN does not raise `pull_request` events, so every gate in
          # pr.yml would silently be skipped and the bump would look green
          # without having been tested at all.
          persist-credentials: false
          # workflow_dispatch can be aimed at any ref, but the pull request is
          # always based on main. Checking out anything else would carry that
          # ref's unrelated commits into the bump, where the working-tree guard
          # below cannot see them.
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve the requested version
        id: resolve
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          TYPE: ${{ inputs.type }}
        run: |
          set -euo pipefail
          resolved="$(npm view "${PACKAGE}@${VERSION}" version --json | tr -d '"[]' | tr ',' '\n' | tail -n 1 | xargs)"
          if [ -z "${resolved}" ]; then
            echo "::error::${PACKAGE}@${VERSION} does not resolve to a published version."
            exit 1
          fi
          slug="$(printf '%s' "${PACKAGE}" | sed 's|^@||; s|/|-|g')"
          echo "resolved=${resolved}"            >> "${GITHUB_OUTPUT}"
          echo "branch=deps/${slug}-${resolved}" >> "${GITHUB_OUTPUT}"
          # One source of truth for the title: the release-signal guard has to
          # check the exact string the pull request will carry.
          echo "title=${TYPE}(deps): bump ${PACKAGE} to ${resolved}" >> "${GITHUB_OUTPUT}"
          echo "::notice::${PACKAGE}@${VERSION} resolves to ${resolved}."

      - name: Refuse to clobber an existing branch
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          # --exit-code reports 2 for "no such ref"; anything else non-zero is a
          # transport failure, which must not be mistaken for a free branch name.
          set +e
          git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            echo "::error::${BRANCH} already exists. Merge or delete it, then run again."
            exit 1
          fi
          if [ "${rc}" -ne 2 ]; then
            echo "::error::Could not reach origin to check for ${BRANCH} (git exit ${rc})."
            exit 1
          fi

      # npm install would happily *add* a package that is not currently a
      # dependency, so a typo in the dispatch input becomes a new production
      # dependency instead of an error. It also re-saves the range with its own
      # save-prefix, which would widen a deliberate pin such as
      # `playwright-core: ~1.62.1` into a caret range. This refuses both.
      - name: Confirm the package can be bumped safely
        id: target
        env:
          PACKAGE: ${{ inputs.package }}
        run: node scripts/resolve-bump-target.mjs --package "${PACKAGE}"

      - name: Install the requested version
        env:
          PACKAGE: ${{ inputs.package }}
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
          SAVE_FLAG: ${{ steps.target.outputs.saveFlag }}
          PREFIX_FLAG: ${{ steps.target.outputs.prefixFlag }}
        run: npm install "${PACKAGE}@${RESOLVED}" "${SAVE_FLAG}" "${PREFIX_FLAG}" --no-audit --no-fund

      # Install scripts stay blocked until the exact name@version is pinned, so
      # a bump that skips this leaves the native bindings unbuilt and fails E2E
      # much later with an opaque error. --fix only rotates already-approved
      # packages; a newly introduced one still needs a human.
      - name: Rotate the install-script allowlist
        run: node scripts/check-allow-scripts.mjs --fix

      # renderTechStack reads dependency versions straight out of package.json,
      # so bumping any version the README advertises leaves the meta:tech-stack
      # fragment stale and fails the Documentation Quality gate. This has to run
      # after the manifest is final, which means after the pin rotation above.
      #
      # Both READMEs are restored from HEAD first so that their only possible
      # diff is the renderer's own output. An approved install script that
      # edited one would otherwise ride along into the commit. Each is restored
      # only if it is tracked, because an unmatched pathspec would abort the
      # step before the renderer, which tolerates a missing file, ever runs.
      - name: Re-render the README marker fragments
        run: |
          set -euo pipefail
          for readme in README.md README.docker-hub.md; do
            if git cat-file -e "HEAD:${readme}" 2>/dev/null; then
              git checkout HEAD -- "${readme}"
            fi
          done
          npm run meta:render

      # Every artefact repaired above is gated in CI, so those same gates run
      # here: a repair that did not take must end the run rather than open a
      # pull request that is red on arrival. The release-signal guard is in the
      # list because a `chore` title on a shipped dependency fails it every
      # time, and that can only be caught before the pull request exists.
      #
      # Semantic gates — audit, licences, unit tests, E2E — cannot be repaired
      # by regenerating a file, so they stay with the pull request's own CI,
      # which reports them accurately. This list therefore covers what this
      # workflow generates, not every gate in pr.yml.
      - name: Verify the generated artefacts satisfy their gates
        env:
          TITLE: ${{ steps.resolve.outputs.title }}
        run: |
          set -euo pipefail
          npm run meta:markers
          npm run meta:check
          npm run lint:allow-scripts
          npm run lint:docs
          node scripts/check-release-signal.mjs --title "${TITLE}" --base HEAD

      - name: Confirm the bump touched only its expected files
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Already at the requested version; nothing to do."
            exit 0
          fi
          unexpected="$(git status --porcelain | grep -v -E '^ M (package\.json|package-lock\.json|README\.md|README\.docker-hub\.md)$' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::The install touched unexpected paths:"
            echo "${unexpected}"
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          git --no-pager diff --stat

      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          TITLE: ${{ steps.resolve.outputs.title }}
        run: |
          set -euo pipefail
          title="${TITLE}"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${BRANCH}"
          # The guard above already proved the only modified files are the
          # manifest, the lockfile and the two rendered READMEs, so staging
          # every tracked modification stages exactly that set — and cannot
          # break on a pathspec if one of those files ever stops existing.
          git add -u
          git commit -m "${title}" -m "Opened by the dependency-bump workflow (run ${GITHUB_RUN_ID})." \
            -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          # The remote is credential-free by design, so the token is supplied
          # for this one command rather than left in .git/config for the whole
          # job. Actions masks it in the log.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          gh pr create \
            --title "${title}" \
            --base main \
            --head "${BRANCH}" \
            --body "$(cat <<EOF
          Raises \`${PACKAGE}\` to \`${RESOLVED}\`.

          ## Why this is not a Dependabot pull request

          Dependabot scans once a day. This package is what breaks when a bank
          changes its site, so an upstream fix is usually needed sooner than the
          next scan, and a version published shortly before a scan can be missed
          because the registry index has not caught up yet. This bump was
          requested on demand instead.

          ## What ran on the runner

          - \`npm install ${PACKAGE}@${RESOLVED}\` regenerated \`package-lock.json\`,
            so the integrity hash was produced by npm from the tarball it fetched.
          - \`check-allow-scripts.mjs --fix\` rotated the install-script pin.
          - \`meta:render\` re-rendered the README marker fragments, which carry
            dependency versions read out of \`package.json\`.
          - The \`meta:markers\`, \`meta:check\`, \`lint:allow-scripts\` and
            \`lint:docs\` gates were then re-run and all pass, so this pull request
            does not arrive with generated files out of sync.
          - \`check-release-signal.mjs\` confirmed this title carries the release
            signal the changed manifest fields require.
          - The diff was checked to touch only the manifest, the lockfile and the
            two rendered READMEs.

          Everything else is deliberately left to CI on this pull request, which is
          the real validation: build, type-checks, unit and mocked E2E suites,
          audit, licences, and the container scans.
          EOF
          )"

          echo "::notice::Opened ${title}"
