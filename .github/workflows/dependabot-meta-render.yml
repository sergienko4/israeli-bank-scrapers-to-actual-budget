name: Dependabot Meta Render

# Keeps Dependabot pull requests green against the two gates a version bump
# predictably breaks, without relaxing either of them.
#
# 1. `scripts/render-readme-meta.mjs` renders the `meta:tech-stack` fragment
#    from `package.json`, so every Dependabot bump of a version the README
#    advertises (`@sergienko4/israeli-bank-scrapers`, `@actual-app/api`,
#    `typescript`, `vitest`, `engines.node`) leaves the fragment stale and
#    fails `Documentation Quality`.
#
# 2. `allowScripts` pins each install-script dependency to an exact version, so
#    bumping one leaves its pin stale. npm does not fail on a stale pin — it
#    silently skips the script, and the break surfaces ~14 minutes later as a
#    missing `better-sqlite3` native binding in E2E.
#
# Dependabot can run neither fix itself, so this workflow applies both and
# commits them onto the Dependabot branch.
#
# Design decisions, each backed by GitHub documentation:
#
# 1. `workflow_run`, not `pull_request` or `pull_request_target` — a workflow
#    initiated by Dependabot through `pull_request` gets a read-only
#    `GITHUB_TOKEN` and no Actions secrets, and `pull_request_target` is
#    restricted exactly the same way when the pull request was created by
#    Dependabot. `workflow_run` is the documented two-step handoff: it runs
#    from the default branch, outside Dependabot's context, with normal secret
#    access.
#    https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-on-actions
#    https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# 2. `RELEASE_TOKEN`, not `GITHUB_TOKEN`, for the push — pushes authenticated
#    with `GITHUB_TOKEN` do not start new workflow runs, which would leave the
#    pull request head with no status checks at all: worse than the failure
#    being fixed.
#    https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
#
# 3. `[dependabot skip]` in the commit subject — by default Dependabot stops
#    rebasing a branch once anyone else pushes to it. The marker keeps
#    Dependabot in control of the branch.
#    https://docs.github.com/en/code-security/dependabot/working-with-dependabot/managing-pull-requests-for-dependency-updates
#
# 4. Triggered on `requested` as well as `completed` — because decision 1 rules
#    out reacting to the pull request itself, the fix cannot precede the run it
#    repairs. Firing when the PR Pipeline is *queued* is the earliest a
#    privileged token is available, so the corrected commit normally lands
#    while the gates are still running rather than after they have gone red.
#
# Rotating a pin re-approves install-script execution for a version no human
# has reviewed. The control is therefore relocated rather than dropped: the
# job posts a comment on the pull request naming every package it re-approved
# and asking for that review before merge. The same drift on a human-authored
# branch still fails hard, at commit time, via the `lint:allow-scripts` gate.
#
# The job runs privileged, so no executable file from the pull request head is
# ever run. The checkout, the install and both scripts come from the default
# branch; `package.json` and `package-lock.json` are overlaid from the head
# only after `npm ci` has finished, purely as data for those scripts to read;
# and the head tree is restored only after the last step that executes
# anything.

on:
  workflow_run:
    workflows: [PR Pipeline]
    # `requested` fires the moment the PR Pipeline is queued, so the render
    # lands while the gates are still running and the very first reported
    # `Documentation Quality` result is the corrected one. `completed` stays
    # as the fallback for the case where the pull request is not yet
    # associated with its head commit when `requested` arrives; by then the
    # tree is normally already in sync and that run exits without pushing.
    types: [requested, completed]
  # Escape hatch for pull requests opened before this workflow existed, and for
  # re-running a render without waiting for a new PR Pipeline run.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to render
        required: true
        type: string

# The push authenticates with RELEASE_TOKEN, so GITHUB_TOKEN stays read-only.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    dependabot-meta-render-${{ inputs.pr ||
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  render:
    name: Render meta and rotate script pins
    # `workflow_run` fires for every PR Pipeline run, including pushes to main.
    # Narrow to pull request runs here; the authoritative author check needs the
    # API and lives in the "Resolve" step below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Checks out the default branch: `workflow_run` never resolves to the pull
      # request head. RELEASE_TOKEN is persisted here so the final push is
      # authenticated without handling the token in a remote URL. fetch-depth 0
      # makes the head commit available locally and keeps the push non-shallow.
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve the pull request and verify it is an npm Dependabot bump
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DISPATCH_PR: ${{ inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          skip() {
            echo "::notice::Skipping auto-render: $1"
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if [ -n "${DISPATCH_PR}" ]; then
            number="${DISPATCH_PR}"
          else
            number=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RUN_HEAD_SHA}/pulls" \
              --jq '.[0].number // empty')
          fi
          [ -n "${number}" ] || skip 'no pull request found for this run.'

          IFS=$'\t' read -r state author head_repo head_sha head_ref < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.state, .user.login, .head.repo.full_name,
                     .head.sha, .head.ref] | @tsv')

          [ "${state}" = 'open' ] || skip "pull request #${number} is ${state}."
          [ "${author}" = 'dependabot[bot]' ] \
            || skip "pull request #${number} was opened by ${author}."
          # Dependabot pushes its branches into this repository, never a fork,
          # so a head elsewhere means the guard assumptions do not hold.
          [ "${head_repo}" = "${GITHUB_REPOSITORY}" ] \
            || skip "head branch lives in ${head_repo}."

          changed=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${number}/files" \
            --jq '.[].filename')
          # README.md and README.docker-hub.md are allowed because an earlier
          # run of this workflow may already have committed them; a later
          # Dependabot push to the same branch must still be renderable.
          unexpected=$(printf '%s\n' "${changed}" | grep -vxE \
            'package\.json|package-lock\.json|README\.md|README\.docker-hub\.md' \
            || true)
          [ -z "${unexpected}" ] \
            || skip "pull request #${number} also changes: ${unexpected}"
          printf '%s\n' "${changed}" | grep -qx 'package\.json' \
            || skip "pull request #${number} does not change package.json."

          {
            echo 'skip=false'
            echo "number=${number}"
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.resolve.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      # `--ignore-scripts`: the renderer only needs the `yaml` package, and the
      # lifecycle scripts of a freshly bumped dependency must never execute in a
      # privileged job. The lockfile is the default branch's, not the head's.
      - name: Install renderer dependencies from the default branch lockfile
        if: steps.resolve.outputs.skip == 'false'
        run: npm ci --ignore-scripts

      # Only data files are taken from the head: the manifest the renderer reads
      # and the documents it rewrites. Every executable file stays at the
      # default branch commit checked out above. `package-lock.json` is safe to
      # overlay because it arrives after `npm ci` — nothing installs from it.
      - name: Overlay the head manifest and documents
        if: steps.resolve.outputs.skip == 'false'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          for file in package.json package-lock.json README.md README.docker-hub.md; do
            if git cat-file -e "${HEAD_SHA}:${file}" 2>/dev/null; then
              git checkout "${HEAD_SHA}" -- "${file}"
            fi
          done

      # Invoked through `node` rather than `npm run` so the overlaid
      # `package.json` cannot inject a script into this privileged job.
      - name: Re-render the marker fragments
        if: steps.resolve.outputs.skip == 'false'
        run: node scripts/render-readme-meta.mjs

      # A bump of a package that runs an install script leaves its exact
      # `allowScripts` pin stale, and npm then silently skips that script — the
      # failure only surfaces much later as a missing native binding. This is
      # pure JSON manipulation over the two overlaid data files; no npm command
      # and no head executable is involved. This is the last step that executes
      # anything.
      - name: Rotate the allowScripts pins to match the bumped lockfile
        id: rotate
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          node scripts/check-allow-scripts.mjs --fix \
            | tee "${RUNNER_TEMP}/rotation.txt"
          # Two outcomes, reported separately because they point in opposite
          # directions: dropping an orphaned entry narrows what may execute and
          # needs no review, whereas re-pinning a bumped package re-approves
          # code nobody has read. Only the latter may claim an approval was
          # granted, so only it triggers the review request below.
          if git diff --quiet -- package.json; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >> "${GITHUB_OUTPUT}"
          fi
          if grep -q '^stale pin: ' "${RUNNER_TEMP}/rotation.txt"; then
            echo 'repinned=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'repinned=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit the rendered documents to the Dependabot branch
        if: steps.resolve.outputs.skip == 'false'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
          CHANGED: ${{ steps.rotate.outputs.changed }}
          REPINNED: ${{ steps.rotate.outputs.repinned }}
        run: |
          set -euo pipefail
          drifted=$(git diff --name-only \
            -- README.md README.docker-hub.md package.json)
          if [ -z "${drifted}" ]; then
            echo "Pull request #${PR_NUMBER} is already in sync."
            exit 0
          fi

          staging="${RUNNER_TEMP}/rendered"
          rm -rf "${staging}"
          mkdir -p "${staging}"
          while IFS= read -r file; do
            cp "${file}" "${staging}/"
          done <<< "${drifted}"

          # Restore the head tree so the new commit has the Dependabot commit as
          # its parent. Nothing is executed from here on.
          git checkout --force -B meta-render "${HEAD_SHA}"
          while IFS= read -r file; do
            cp "${staging}/$(basename "${file}")" "${file}"
            git add -- "${file}"
          done <<< "${drifted}"

          if [ "${REPINNED}" = 'true' ]; then
            subject='chore: re-render meta and rotate script pins'
          elif [ "${CHANGED}" = 'true' ]; then
            subject='chore: re-render meta and prune script pins'
          else
            subject='docs: re-render README meta markers'
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "${subject} [dependabot skip]"
          # A plain push, never forced: if Dependabot moved the branch while
          # this ran, the push is rejected and the next run renders the newer
          # head instead of overwriting it.
          git push origin "meta-render:refs/heads/${HEAD_REF}"
          echo "Rendered and pushed to #${PR_NUMBER} (${HEAD_REF})."

      # Rotating a pin re-approves install-script execution for a version no human
      # has looked at, so the control is not dropped, it is relocated: the pipeline
      # stays green and the review it used to force becomes this comment. The
      # rotation is narrow by construction — it only moves the version of a package
      # somebody already approved, never approves a new one — so what needs reading
      # here is a release diff, not a trust decision. Gated on `repinned` rather
      # than on the file changing, because dropping an orphaned entry *withdraws*
      # an approval; asking for review of that would cry wolf on the one comment
      # that has to stay worth reading. Keyed by a digest of the rotation so a
      # rebase that re-renders the same change does not post a duplicate, while a
      # genuinely different rotation always gets its own comment.
      - name: Request review of the newly approved install scripts
        if: steps.resolve.outputs.skip == 'false' && steps.rotate.outputs.repinned == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          digest=$(sha256sum "${RUNNER_TEMP}/rotation.txt" | cut -c1-16)
          marker="<!-- allowscripts-rotation:${digest} -->"

          # Written to a file rather than piped into `grep -q`: an early-exiting
          # reader would SIGPIPE `gh`, and `pipefail` would report that as a
          # failed lookup, which reads as "not yet flagged" and duplicates the
          # comment.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[].body' > "${RUNNER_TEMP}/comments.txt"

          if grep -qF "${marker}" "${RUNNER_TEMP}/comments.txt"; then
            echo 'This rotation has already been flagged for review.'
            exit 0
          fi

          {
            echo "${marker}"
            echo '### ⚠️ Install-script allowlist rotated automatically'
            echo
            echo 'This bump changed a package that runs an install script, so'
            echo 'its `allowScripts` pin was re-pinned to keep the build working:'
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/rotation.txt"
            echo '```'
            echo
            echo 'Exact-version pinning is a supply-chain control: a new version'
            echo 'cannot run code during `npm ci` until someone approves it. The'
            echo 'rotation above kept this pull request green, so **the approval'
            echo 'has not happened yet — it is yours to give.** Before merging,'
            echo 'review the release diff for the packages listed above.'
            echo
            echo 'Only packages that were already approved get rotated. A'
            echo 'dependency that has newly gained an install script is reported'
            echo 'as `needs human approval` and fails the `lint:allow-scripts`'
            echo 'gate instead, so it can never be approved automatically.'
          } > "${RUNNER_TEMP}/comment.md"

          gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"
