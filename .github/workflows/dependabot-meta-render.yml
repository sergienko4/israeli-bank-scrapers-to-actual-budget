name: Dependabot Meta Render

# Keeps Dependabot pull requests green against the README marker gate.
#
# `scripts/render-readme-meta.mjs` renders the `meta:tech-stack` fragment from
# `package.json`, so every Dependabot bump of a version the README advertises
# (`@sergienko4/israeli-bank-scrapers`, `@actual-app/api`, `typescript`,
# `vitest`, `engines.node`) leaves the fragment stale and fails the
# `Documentation Quality` gate. Dependabot cannot run `npm run meta:render`
# itself, so this workflow renders the fragments and commits them onto the
# Dependabot branch instead of relaxing the gate.
#
# Design decisions, each backed by GitHub documentation:
#
# 1. `workflow_run`, not `pull_request` or `pull_request_target` — a workflow
#    initiated by Dependabot through `pull_request` gets a read-only
#    `GITHUB_TOKEN` and no Actions secrets, and `pull_request_target` is
#    restricted exactly the same way when the pull request was created by
#    Dependabot. `workflow_run` is the documented two-step handoff: it runs
#    from the default branch, outside Dependabot's context, with normal secret
#    access.
#    https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-on-actions
#    https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# 2. `RELEASE_TOKEN`, not `GITHUB_TOKEN`, for the push — pushes authenticated
#    with `GITHUB_TOKEN` do not start new workflow runs, which would leave the
#    pull request head with no status checks at all: worse than the failure
#    being fixed.
#    https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
#
# 3. `[dependabot skip]` in the commit subject — by default Dependabot stops
#    rebasing a branch once anyone else pushes to it. The marker keeps
#    Dependabot in control of the branch.
#    https://docs.github.com/en/code-security/dependabot/working-with-dependabot/managing-pull-requests-for-dependency-updates
#
# The job runs privileged, so no executable file from the pull request head is
# ever run: the checkout, the lockfile and the renderer all come from the
# default branch, and the head tree is only restored after the last step that
# executes anything.

on:
  workflow_run:
    workflows: [PR Pipeline]
    types: [completed]
  # Escape hatch for pull requests opened before this workflow existed, and for
  # re-running a render without waiting for a new PR Pipeline run.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to render
        required: true
        type: string

# The push authenticates with RELEASE_TOKEN, so GITHUB_TOKEN stays read-only.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    dependabot-meta-render-${{ inputs.pr ||
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  render:
    name: Render README meta
    # `workflow_run` fires for every PR Pipeline run, including pushes to main.
    # Narrow to pull request runs here; the authoritative author check needs the
    # API and lives in the "Resolve" step below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Checks out the default branch: `workflow_run` never resolves to the pull
      # request head. RELEASE_TOKEN is persisted here so the final push is
      # authenticated without handling the token in a remote URL. fetch-depth 0
      # makes the head commit available locally and keeps the push non-shallow.
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve the pull request and verify it is an npm Dependabot bump
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DISPATCH_PR: ${{ inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          skip() {
            echo "::notice::Skipping auto-render: $1"
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if [ -n "${DISPATCH_PR}" ]; then
            number="${DISPATCH_PR}"
          else
            number=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RUN_HEAD_SHA}/pulls" \
              --jq '.[0].number // empty')
          fi
          [ -n "${number}" ] || skip 'no pull request found for this run.'

          IFS=$'\t' read -r state author head_repo head_sha head_ref < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.state, .user.login, .head.repo.full_name,
                     .head.sha, .head.ref] | @tsv')

          [ "${state}" = 'open' ] || skip "pull request #${number} is ${state}."
          [ "${author}" = 'dependabot[bot]' ] \
            || skip "pull request #${number} was opened by ${author}."
          # Dependabot pushes its branches into this repository, never a fork,
          # so a head elsewhere means the guard assumptions do not hold.
          [ "${head_repo}" = "${GITHUB_REPOSITORY}" ] \
            || skip "head branch lives in ${head_repo}."

          changed=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${number}/files" \
            --jq '.[].filename')
          # README.md and README.docker-hub.md are allowed because an earlier
          # run of this workflow may already have committed them; a later
          # Dependabot push to the same branch must still be renderable.
          unexpected=$(printf '%s\n' "${changed}" | grep -vxE \
            'package\.json|package-lock\.json|README\.md|README\.docker-hub\.md' \
            || true)
          [ -z "${unexpected}" ] \
            || skip "pull request #${number} also changes: ${unexpected}"
          printf '%s\n' "${changed}" | grep -qx 'package\.json' \
            || skip "pull request #${number} does not change package.json."

          {
            echo 'skip=false'
            echo "number=${number}"
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.resolve.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm

      # `--ignore-scripts`: the renderer only needs the `yaml` package, and the
      # lifecycle scripts of a freshly bumped dependency must never execute in a
      # privileged job. The lockfile is the default branch's, not the head's.
      - name: Install renderer dependencies from the default branch lockfile
        if: steps.resolve.outputs.skip == 'false'
        run: npm ci --ignore-scripts

      # Only data files are taken from the head: the manifest the renderer reads
      # and the documents it rewrites. Every executable file stays at the
      # default branch commit checked out above.
      - name: Overlay the head manifest and documents
        if: steps.resolve.outputs.skip == 'false'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          for file in package.json README.md README.docker-hub.md; do
            if git cat-file -e "${HEAD_SHA}:${file}" 2>/dev/null; then
              git checkout "${HEAD_SHA}" -- "${file}"
            fi
          done

      # Invoked through `node` rather than `npm run` so the overlaid
      # `package.json` cannot inject a script into this privileged job. This is
      # the last step that executes anything.
      - name: Re-render the marker fragments
        if: steps.resolve.outputs.skip == 'false'
        run: node scripts/render-readme-meta.mjs

      - name: Commit the rendered documents to the Dependabot branch
        if: steps.resolve.outputs.skip == 'false'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          drifted=$(git diff --name-only -- README.md README.docker-hub.md)
          if [ -z "${drifted}" ]; then
            echo "Marker fragments on #${PR_NUMBER} are already in sync."
            exit 0
          fi

          staging="${RUNNER_TEMP}/rendered"
          rm -rf "${staging}"
          mkdir -p "${staging}"
          while IFS= read -r file; do
            cp "${file}" "${staging}/"
          done <<< "${drifted}"

          # Restore the head tree so the new commit has the Dependabot commit as
          # its parent. Nothing is executed from here on.
          git checkout --force -B meta-render "${HEAD_SHA}"
          while IFS= read -r file; do
            cp "${staging}/$(basename "${file}")" "${file}"
            git add -- "${file}"
          done <<< "${drifted}"

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: re-render README meta markers [dependabot skip]'
          # A plain push, never forced: if Dependabot moved the branch while
          # this ran, the push is rejected and the next run renders the newer
          # head instead of overwriting it.
          git push origin "meta-render:refs/heads/${HEAD_REF}"
          echo "Rendered and pushed to #${PR_NUMBER} (${HEAD_REF})."
