name: Lockfile refresh

# Dependabot raises the versions declared in package.json. Nothing raised the
# transitive versions recorded *inside* package-lock.json once their parents'
# ranges already allowed a newer release: npm only re-resolves those when
# something regenerates the lockfile, and no routine job did.
#
# That gap was not theoretical. `browserslist` sat pinned at 4.28.2 while its
# parent `header-generator` declared `^4.21.1` — a range that already allowed
# the patched 4.28.8. A CVE against 4.28.2 then failed both `npm audit` and
# Trivy against the production tree and blocked four unrelated Dependabot pull
# requests at once, none of which had anything to do with browserslist.
#
# Pinning a floor in `overrides` cleared that one advisory, but a floor is
# inert by itself — it is only ever applied when the lockfile is regenerated.
# This workflow is the thing that regenerates it, so the next stale transitive
# pin is found on a schedule instead of by a CVE landing on unrelated work.
#
# SCOPE: transitive refresh, within ranges parents already permit, plus any
# `npm audit fix` that stays inside those ranges. This is NOT a Dependabot
# replacement: raising a *declared* range stays Dependabot's job
# (.github/dependabot.yml). Neither command leaves a range a parent declares,
# but a loose range (`*`, `>=1.0.0`) still admits a new major, so "inside the
# range" is not "non-breaking". The summary step therefore lists every pin
# that crossed a breaking boundary (findMajorBumps in
# scripts/refresh-lockfile-logic.mjs), and such a refresh is never armed.
#
# OVERRIDES (ADR-0003): an advisory on a transitive package that a parent
# pins *exactly* is out of reach of both commands — and of Dependabot, which
# cannot raise a range nobody declares. That is how GHSA-gg6h-894w-4m9c on
# re2js (exact-pinned by markdownlint) turned main and every Dependabot pull
# request red at once. The floor step raises an `overrides` floor for such an
# advisory under rules R1–R7 (scripts/override-floor-logic.mjs), regenerates
# only the floored packages and proves each floor left its package with no
# advisory.
# `package.json` may change only inside `overrides`, which a dedicated step
# verifies before anything is committed. The weekly and dispatched runs also
# drop overrides that no longer change a single locked version. A floor that
# is younger than the release-age window or leaves the locked line, and an
# advisory no floor can clear, route the pull request to a human instead.
#
# ADVISORY WATCH: the `advisory` job audits main every four hours, so an
# advisory published mid-week is remediated within hours instead of on
# Thursday. On that trigger the refresh runs only when main's audit is red,
# and the job keeps one "Unresolved dependency advisories" issue open while
# any advisory has no floor.
#
# This supersedes the retired `dependency-check.yml`, whose two recorded
# failure modes are addressed rather than inherited:
#   1. It could not cross majors. Deliberately crossing one is still out of
#      scope; a major that a loose range admits anyway is labelled
#      needs-manual-review instead of merged unseen.
#   2. It crashed on the scraper's patch-package postinstall. Cannot recur:
#      `--package-lock-only` ignores node_modules and downloads nothing, so no
#      install script exists to run.
#
# MERGE: the pull request arms squash auto-merge as soon as it is opened, so a
# green refresh lands without a human click. Every required check on main
# still gates it — auto-merge only removes the click, never a gate. Four cases
# stay with a human: a refresh that crosses a major (labelled, never armed),
# one whose floor needs review or that leaves an advisory unresolved
# (labelled, never armed), one whose branch is not proven push-locked by the
# "Restrict updates" ruleset (labelled, never armed, run red) and one whose CI
# fails. Each stays
# open until a later run supersedes it: the next weekly run, a four-hourly
# run that produces a different change, or the first push to main that leaves
# it behind (the `behind` job below). A refresh whose
# branch moves after it was opened joins them, best effort:
# lockfile-refresh-guard.yml withdraws auto-merge and labels it, but reacts
# after the push. The preventive control is the "Restrict updates" ruleset in
# docs/architecture/ci-pipeline.md.

on:
  schedule:
    # Thursday 05:00 UTC. GitHub only evaluates cron in UTC — unlike Dependabot,
    # `schedule` has no `timezone` key, so do not copy that pattern here.
    # Mid-week deliberately: Dependabot batches Monday 06:00 Asia/Jerusalem and
    # both e2e-schedule.yml and stale.yml also fire Monday, so a Monday slot
    # would bury this PR in that pile-up and leave no working days to react.
    - cron: '0 5 * * 4'
    # Every four hours, off the hour to dodge the top-of-hour scheduler
    # backlog. Only the `advisory` job does real work on this trigger unless
    # main's audit is red (ADR-0003). The `refresh` gate and the idempotency
    # step below match this exact string, so change all three together.
    - cron: '23 */4 * * *'
  workflow_dispatch:
  # Main moved. The ruleset requires a branch to be strictly up to date with
  # main, so an open refresh that main has moved past can never merge, and
  # updating its branch would merge two lockfiles rather than regenerate one
  # (usually a conflict). The `behind` job decides whether one needs
  # regenerating; a push that leaves no refresh behind ends there.
  push:
    branches: [main]

# Every write — pushing, opening, arming or labelling the pull request, and
# closing a superseded refresh — goes through RELEASE_TOKEN. The workflow
# token reads the checkout and pull requests, and in the `advisory` job alone
# writes the one tracking issue; each job declares exactly what it needs.
permissions:
  contents: read

# Every waiting run is kept (`queue: max`). By default a newly queued run
# cancels the one already waiting, so a push to main could cancel a waiting
# weekly or dispatched refresh and then find nothing behind, losing that
# refresh until the next week. Kept runs execute in order, and each one
# regenerates from main as it is when that run starts.
concurrency:
  group: lockfile-refresh
  cancel-in-progress: false
  queue: max

jobs:
  # Read-only, with the workflow token: nothing is checked out and nothing is
  # written. It uses the same branch filter as the supersede step, so a fork's
  # pull request never triggers a regeneration. A comparison that cannot be
  # read skips that pull request, not the run; the next push or the weekly
  # run looks again.
  behind:
    name: Find a refresh that main has moved past
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - name: Check whether an open refresh is behind main
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository > "${RUNNER_TEMP}/open.json"
          jq -r '.[]
            | select((.isCrossRepository | not)
                and (.headRefName | startswith("chore/lockfile-refresh-")))
            | "\(.number)\t\(.headRefOid)"' "${RUNNER_TEMP}/open.json" > "${RUNNER_TEMP}/refreshes.tsv"
          stale=false
          # The list arrives on its own descriptor: gh may read stdin.
          while IFS=$'\t' read -r number sha <&3; do
            behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" \
              --jq '.behind_by // empty') || behind=''
            if ! [[ "${behind}" =~ ^[0-9]+$ ]]; then
              echo "::warning::#${number}: could not compare ${sha} with main; skipped."
              continue
            fi
            if [ "${behind}" -gt 0 ]; then
              echo "::notice::Refresh #${number} is ${behind} commit(s) behind main; regenerating it."
              stale=true
            fi
          done 3< "${RUNNER_TEMP}/refreshes.tsv"
          echo "stale=${stale}" >> "${GITHUB_OUTPUT}"

  # Audits main on every trigger, so `refresh` can depend on it plainly. Only
  # the four-hourly trigger acts on the verdict: it starts a refresh when the
  # audit is red. `npm audit --package-lock-only` reads the lockfile and the
  # advisory database; nothing is installed or executed, so this job needs
  # neither `npm ci` nor RELEASE_TOKEN. Its workflow token holds `issues:
  # write` for the tracking issue alone, and is absent from the audit and
  # planner steps.
  advisory:
    name: Audit main for unresolved advisories
    runs-on: ubuntu-latest
    # The plan step regenerates the lockfile for the floored packages, up to
    # twice, which a cold npm cache can stretch past a few minutes.
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      red: ${{ steps.audit.outputs.red }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # check-audit.mjs exits 0 when clean, 1 on a policy violation and 2 when
      # npm could not produce a report. Only 0 and 1 are verdicts. Exit 2 fails
      # this job — GitHub notifies — and leaves `red` empty, so no refresh
      # starts and nothing is remediated against an advisory feed that is down.
      - name: Audit main
        id: audit
        run: |
          set -euo pipefail
          status=0
          node config/check-audit.mjs || status=$?
          case "${status}" in
            0) echo 'red=false' >> "${GITHUB_OUTPUT}" ;;
            1) echo 'red=true' >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::npm audit could not produce a report (exit ${status}); nothing is remediated until it can."
              exit 1
              ;;
          esac

      # The same --apply the refresh runs, in this job's throwaway checkout:
      # only applying finds a floor that leaves its package with an advisory
      # (`floor-ineffective`), and a read-only plan would miss it, so the
      # issue below could stay silent while every run rolls that floor back.
      # Nothing is installed or executed; the npm allow-list holds here too.
      # The refresh job applies again on its own, further-updated tree. A
      # planner failure leaves the issue as it is rather than claiming every
      # advisory is fine.
      - name: Plan override floors
        id: plan
        if: steps.audit.outputs.red == 'true'
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/plan.json"
          if ! node scripts/plan-override-floors.mjs --apply > "${plan}" \
            || ! jq -e '(.floors | type == "array") and (.rejections | type == "array")' "${plan}" > /dev/null; then
            echo '::warning::The override-floor planner failed; the tracking issue is left as it is.'
            echo 'planned=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'planned=true' >> "${GITHUB_OUTPUT}"
          {
            jq -r '.floors[] | "- \(.package): \(.floor) (\(.kind)) for \(.ghsas | join(", "))"' "${plan}"
            jq -r '.rejections[] | "- \(.package): rejected (\(.reason)) for \(.ghsas | join(", "))"' "${plan}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # One open issue, found by label, title and author so a human's issue is
      # never edited or closed. It opens only while some advisory has no
      # floor: no pull request can carry that, so nothing else would notify.
      # Once every advisory has a floor, its body says so, replacing a
      # rejection table that no longer applies, and says whether a floor
      # holds the refresh for a maintainer (a fresh or line-leaving floor, or
      # a plan that does not say); the refresh's own verdict can still hold it
      # for other reasons. It stays open until `main` audits clean.
      # REST rather than `gh issue`, which goes through GraphQL mutations that
      # also touch deprecated classic projects. The jq filter is a literal, so
      # no API value is ever spliced into shell.
      - name: Track unresolved advisories in an issue
        id: issue
        if: steps.audit.outputs.red == 'false' || steps.plan.outputs.planned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RED: ${{ steps.audit.outputs.red }}
        run: |
          set -euo pipefail
          title='Unresolved dependency advisories'
          number="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=blocked-by-advisory&per_page=100" \
            --jq '[.[] | select((.pull_request | not)
                    and .title == "Unresolved dependency advisories"
                    and .user.login == "github-actions[bot]")][0].number // empty')"
          if [ "${RED}" = false ]; then
            [ -n "${number}" ] || exit 0
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
              -f body="\`main\` audits clean again (lockfile-refresh run ${GITHUB_RUN_ID})." > /dev/null
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${number}" \
              -f state=closed -f state_reason=completed > /dev/null
            echo "::notice::Closed #${number}: main audits clean."
            exit 0
          fi
          plan="${RUNNER_TEMP}/plan.json"
          if [ "$(jq '.rejections | length' "${plan}")" -eq 0 ]; then
            [ -n "${number}" ] || exit 0
            body="$(jq -r --arg run "${GITHUB_RUN_ID}" '
              "`main` still fails `npm run audit`. Every advisory now has an `overrides` floor, "
              + (if .requiresReview == false
                 then "and no floor needs review; the lockfile refresh pull request carries them, and is held for a maintainer only if another change in it needs review."
                 else "but at least one is fresh or leaves its locked line, so the lockfile refresh pull request is labelled `needs-manual-review` and waits for a maintainer to review and merge it." end)
              + "\n\nUpdated by lockfile-refresh run \($run); this issue closes itself once `main` audits clean."' "${plan}")"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${number}" -f body="${body}" > /dev/null
            echo "::notice::Updated #${number}: no advisory is rejected."
            exit 0
          fi
          body="$(jq -r --arg run "${GITHUB_RUN_ID}" '
            "`main` fails `npm run audit`, and the lockfile refresh cannot raise an `overrides` floor for the advisories below. Each needs a maintainer: a declared-range bump, a reviewed override, or an accepted-risk entry in `config/audit-policy.mjs`.\n\n"
            + "| Package | Advisories | Reason |\n| --- | --- | --- |\n"
            + ([.rejections[] | "| `\(.package)` | \(.ghsas | join(", ")) | \(.reason) |"] | join("\n"))
            + "\n\nReasons are defined in `docs/decisions/ADR-0003-automated-override-floors.md`. Updated by lockfile-refresh run \($run); this issue closes itself once `main` audits clean."' "${plan}")"
          if [ -n "${number}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${number}" -f body="${body}" > /dev/null
            echo "::notice::Updated #${number}."
            exit 0
          fi
          gh label create blocked-by-advisory --repo "${GITHUB_REPOSITORY}" --force --color B60205 \
            --description 'Blocked by a dependency advisory on the base branch'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" -f title="${title}" -f body="${body}" \
            -f 'labels[]=blocked-by-advisory' > /dev/null
          echo '::notice::Opened the unresolved-advisories issue.'

  refresh:
    name: Refresh transitive lockfile pins
    # The weekly and dispatched runs always refresh; `behind` is skipped for
    # them, and `!cancelled()` keeps that skip from skipping this job too. A
    # push refreshes only when `behind` found a refresh to replace; if
    # `behind` failed, its output is empty and nothing is regenerated. The
    # four-hourly run refreshes only when `advisory` found main red; a failed
    # `advisory` leaves `red` empty, so that run regenerates nothing either.
    needs: [behind, advisory]
    if: >-
      !cancelled()
      && (github.event_name != 'push' || needs.behind.outputs.stale == 'true')
      && (github.event.schedule != '23 */4 * * *' || needs.advisory.outputs.red == 'true')
    runs-on: ubuntu-latest
    # Pruning regenerates the lockfile once per override, which takes minutes.
    timeout-minutes: 30
    # The idempotency step reads open pull requests with the workflow token.
    permissions:
      contents: read
      pull-requests: read
    # Nothing below runs `npm install`, so husky's `prepare` never executes and
    # no git hooks are ever planted in this checkout. This is set so that stays
    # true if a future step adds an install, not to suppress a hook that would
    # otherwise run — committing with --no-verify is prohibited by CLAUDE.md,
    # and the gates that matter run on the pull request's own CI.
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          # No PAT here and no persisted credentials: a credential left in
          # .git/config is readable by anything the job runs. The PAT appears
          # only in the last two steps. The pull request step needs it because
          # a pull request opened with GITHUB_TOKEN does not raise
          # `pull_request` events — so every gate in pr.yml would be skipped
          # and the refresh would look green without having been tested at
          # all.
          persist-credentials: false
          # `schedule` always runs on the default branch, but workflow_dispatch
          # can be aimed at any ref. The pull request is always based on main,
          # so checking out anything else would carry that ref's unrelated
          # commits into the refresh.
          ref: main

      # The npm bundled with this Node is used as is. lockfile-sync.yml
      # installs the image's pinned npm, but it holds no secret; this job
      # later holds RELEASE_TOKEN, so it runs nothing fetched from the
      # registry.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Capture the committed lockfile and manifest
        run: |
          cp package-lock.json "${RUNNER_TEMP}/before.json"
          cp package.json "${RUNNER_TEMP}/package.before.json"

      # --package-lock-only ignores node_modules and downloads no tarballs, so
      # this job never installs or executes third-party code at all. That is
      # what lets the token step below be safe in the same job: there is no
      # freshly installed package that could shadow a later command. The
      # explicit --ignore-scripts is redundant under that flag and kept as
      # defence in depth, not because a script would otherwise run.
      - name: Refresh transitive pins
        run: npm update --package-lock-only --ignore-scripts

      # Dependabot security updates only open a pull request when it can raise
      # a range, so a vulnerable transitive pin whose fix sits inside its
      # parent's existing range often gets no pull request at all. `npm audit
      # fix` closes that gap with the same lockfile-only, no-scripts guarantees
      # as the step above. `--force` is never used: it crosses majors, which is
      # Dependabot's job and needs review. A major that a loose range admits
      # without `--force` is caught by the summary step, not here.
      #
      # This step is best-effort and never fails the job. The authoritative
      # gate stays `npm run audit` (config/check-audit.mjs with
      # config/audit-policy.mjs) on the pull request's own CI. An advisory left
      # unfixed here fails that gate, so auto-merge never lands it. Advisories
      # outside every parent's range are the floor step's job, below.
      #
      # If the fix needs package.json, both files are put back to their state
      # after `npm update`. Restoring only package.json would leave the
      # lockfile's root entry declaring ranges package.json does not.
      - name: Apply non-breaking audit fixes
        run: |
          set -euo pipefail
          cp package-lock.json "${RUNNER_TEMP}/updated.json"
          if ! npm audit fix --package-lock-only --ignore-scripts; then
            echo '::warning::npm audit fix left advisories unresolved; the pull request audit gate decides whether they block.'
          fi
          if ! git diff --quiet -- package.json; then
            echo '::warning::npm audit fix wanted to edit package.json; discarding its changes. Raising a declared range is a reviewed change.'
            git checkout -- package.json
            cp "${RUNNER_TEMP}/updated.json" package-lock.json
          fi

      # Weekly and dispatched runs only: it regenerates the lockfile once per
      # override, which is too slow for the four-hourly watch and pointless on
      # a push. An override is dropped only when removing it and running
      # `npm update <name> --package-lock-only --ignore-scripts` locks exactly
      # the same versions, so the tree — and therefore the audit — is
      # unchanged. Best effort: a failure restores both files and keeps every
      # override. It runs after the audit-fix step, which reverts any
      # package.json edit, and before the floor step, which plans from the
      # pruned manifest. No token.
      - name: Drop overrides that no longer shape the tree
        id: prune
        if: github.event.schedule == '0 5 * * 4' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/prune.json"
          if ! node scripts/plan-override-floors.mjs --prune > "${result}" \
            || ! jq -e '.pruned | type == "array"' "${result}" > /dev/null; then
            echo '::warning::Pruning overrides failed; both files were restored and every override is kept.'
            rm -f "${result}"
            exit 0
          fi
          jq -r '.pruned[] | "- \(.): dropped, it no longer changes a locked version"' "${result}" >> "${GITHUB_STEP_SUMMARY}"

      # The two commands above can only move a transitive pin inside the range
      # its parent declares. A parent that pins *exactly* leaves no room, so a
      # fix outside that pin needs an `overrides` floor. The planner applies
      # rules R1–R7 (ADR-0003, scripts/override-floor-logic.mjs): transitive
      # packages only, one locked line, a fixed release in the registry. It
      # then regenerates the floored packages alone with
      #   npm update <pkgs> --package-lock-only --ignore-scripts
      #     --min-release-age=3 --min-release-age-exclude=@sergienko4/israeli-bank-scrapers
      # (plus an exclude per fresh floor), re-audits, and drops any floor whose
      # package still has an advisory, in at most two passes; a pass that adds
      # a blocking advisory to any other package drops every floor. Every npm call goes
      # through the CLI's allow-list, so no install, `ci`, `exec` or `npx` can
      # run. `requires_review` is true when a floor is fresh or leaves its
      # locked line, or an advisory has no floor at all; the pull request step
      # then labels instead of arming. Best effort like the audit-fix step: a
      # failure restores both files and the refresh carries no floor. No token.
      - name: Raise override floors for out-of-range advisories
        id: floors
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/floors.json"
          if ! node scripts/plan-override-floors.mjs --apply > "${plan}" \
            || ! jq -e '(.floors | type == "array") and (.rejections | type == "array")
                  and (.requiresReview | type == "boolean")' "${plan}" > /dev/null; then
            echo '::warning::The override-floor planner failed; both files were restored and this refresh carries no floor.'
            rm -f "${plan}"
            { echo 'complete=false'; echo 'overrides_changed=false'; echo 'requires_review=false'; } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "complete=$(jq '.rejections | length == 0' "${plan}")"
            echo "overrides_changed=$(jq '.floors | length > 0' "${plan}")"
            echo "requires_review=$(jq '.requiresReview' "${plan}")"
          } >> "${GITHUB_OUTPUT}"
          {
            jq -r '.floors[] | "- \(.package): \(.floor) (\(.kind)) for \(.ghsas | join(", "))"' "${plan}"
            jq -r '.rejections[] | "- \(.package): rejected (\(.reason)) for \(.ghsas | join(", "))"' "${plan}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # A prune changes package.json alone, so the manifest counts as a change
      # too; the next step vets it before anything is committed.
      - name: Detect whether anything moved
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json package.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Every transitive pin is already current.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # `npm update` is documented not to touch package.json, and the audit
      # step above undoes any package.json edit of its own. The floor and prune
      # steps may edit `overrides`, and only the keys they reported. This
      # asserts the result rather than trusting any of them: anything else in
      # the tree changing means npm did something this workflow has not
      # reasoned about, and the commit below would silently carry it. A plan or
      # prune result is passed only when its step left one; without it no
      # override key may change at all.
      - name: Verify only the lockfile and overrides changed
        id: verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          modified="$(git diff --name-only)"
          unexpected="$(grep -vxE 'package-lock\.json|package\.json' <<< "${modified}" || true)"
          if [ -n "${unexpected}" ]; then
            echo '::error::Expected only package-lock.json and package.json overrides to change. Got:'
            echo "${modified}"
            exit 1
          fi
          if grep -qx 'package.json' <<< "${modified}"; then
            args=(--verify-manifest "${RUNNER_TEMP}/package.before.json")
            [ ! -f "${RUNNER_TEMP}/floors.json" ] || args+=(--plan "${RUNNER_TEMP}/floors.json")
            [ ! -f "${RUNNER_TEMP}/prune.json" ] || args+=(--prune-result "${RUNNER_TEMP}/prune.json")
            node scripts/plan-override-floors.mjs "${args[@]}"
          fi

      # The same guard CI runs on every pull request, applied here so a
      # non-canonical entry is caught before it is committed rather than after.
      - name: Verify the regenerated lockfile is canonical
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/refresh-lockfile.mjs --check

      # The summary's shape is checked before any field is read. jq reads a
      # missing or null `majorBumps` as `length` 0, so a refresh whose majors
      # were never counted would be armed, and a missing title or body would
      # surface as the literal text "null". The check is its own command:
      # a jq failure inside `echo "$(...)"` would not trip errexit. The floor
      # plan and prune result are passed only when their steps left one; an
      # `overrides` change makes the title `fix(deps)`.
      - name: Summarise the refresh
        id: summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/summary.json"
          args=("${RUNNER_TEMP}/before.json" package-lock.json)
          [ ! -f "${RUNNER_TEMP}/floors.json" ] || args+=(--floors "${RUNNER_TEMP}/floors.json")
          [ ! -f "${RUNNER_TEMP}/prune.json" ] || args+=(--prune "${RUNNER_TEMP}/prune.json")
          node scripts/summarize-refresh.mjs "${args[@]}" > "${summary}"
          if ! jq -e '(.title | type == "string" and length > 0)
                and (.body | type == "string" and length > 0)
                and (.majorBumps | type == "array")' "${summary}" > /dev/null; then
            echo '::error::The refresh summary lacks a title, a body or a majorBumps list; refusing to open the pull request.'
            exit 1
          fi
          {
            echo "title=$(jq -r .title "${summary}")"
            echo "majors=$(jq '.majorBumps | length' "${summary}")"
            echo 'body<<LOCKFILE_REFRESH_BODY'
            jq -r .body "${summary}"
            echo 'LOCKFILE_REFRESH_BODY'
          } >> "$GITHUB_OUTPUT"

      # The commit type comes from the summary, not from a hard-coded `chore`.
      # npm and the audit step may not leave package.json edited, so the
      # release-signal guard — which compares package.json and the Dockerfile
      # — cannot see a runtime bump they make. An audit fix to a runtime pin
      # therefore releases as `fix(deps)`, and a dev-only one stays
      # `chore(deps)`. A floor or a prune does edit `overrides`, which that
      # guard counts as shipped; the summary titles those `fix(deps)` too.
      # Hard-coding `chore` would ship a transitive runtime change to users
      # with no release, which is the exact failure
      # scripts/release-signal-logic.mjs exists to prevent.
      - name: Commit the refresh
        if: steps.diff.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.summary.outputs.title }}
          BRANCH: chore/lockfile-refresh-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${BRANCH}"
          # The guard above proved these two are the only modifications, and
          # that package.json moved only inside the reported overrides, so
          # naming them stages exactly the intended change.
          git add package-lock.json package.json
          git commit -m "${TITLE}" \
            -m "Opened by the lockfile-refresh workflow (run ${GITHUB_RUN_ID})." \
            -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'

      # Four-hourly runs only. While main stays red — a fresh floor waiting
      # out its review, or CI still running on the last refresh — every run
      # regenerates the same commit, and opening it again would close and
      # replace an identical pull request every four hours. An open refresh
      # is kept when it carries byte-identical package.json and lockfile blobs,
      # main has not moved past it, its needs-manual-review label matches
      # this run's decision, and — when this run would arm — auto-merge is
      # actually armed on it. Any difference — including a fresh floor that has
      # aged into auto-eligibility, or an earlier run whose arming failed —
      # opens the new one, and the supersede step retires the old. Weekly, push
      # and dispatched runs always regenerate, as before. Any read that fails
      # keeps that candidate out, so the fallback is the old behaviour.
      # Read-only, with the workflow token.
      - name: Skip a refresh an open pull request already carries
        id: same
        if: >-
          steps.diff.outputs.changed == 'true'
          && github.event.schedule == '23 */4 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          MAJORS: ${{ steps.summary.outputs.majors }}
          REQUIRES_REVIEW: ${{ steps.floors.outputs.requires_review }}
        run: |
          set -euo pipefail
          manifest_blob="$(git rev-parse HEAD:package.json)"
          lock_blob="$(git rev-parse HEAD:package-lock.json)"
          want="package-lock.json=${lock_blob} package.json=${manifest_blob}"
          review=false
          if [ "${MAJORS}" != 0 ] || [ "${REQUIRES_REVIEW}" != false ]; then review=true; fi
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository,labels,autoMergeRequest > "${RUNNER_TEMP}/open.json"
          jq -r '.[]
            | select((.isCrossRepository | not)
                and (.headRefName | startswith("chore/lockfile-refresh-")))
            | "\(.number)\t\(.headRefOid)\t\(any(.labels[]?; .name == "needs-manual-review"))\t\(.autoMergeRequest != null)"' \
            "${RUNNER_TEMP}/open.json" > "${RUNNER_TEMP}/candidates.tsv"
          # The list arrives on its own descriptor: gh may read stdin.
          while IFS=$'\t' read -r number sha labelled armed <&3; do
            [ "${labelled}" = "${review}" ] || continue
            # An auto-eligible refresh whose arming failed would otherwise wait
            # for a human until the weekly run; replacing it re-arms.
            [ "${review}" = true ] || [ "${armed}" = true ] || continue
            blobs=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${sha}" \
              --jq '[.tree[] | select(.path == "package.json" or .path == "package-lock.json")
                     | "\(.path)=\(.sha)"] | sort | join(" ")') || continue
            [ "${blobs}" = "${want}" ] || continue
            behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" \
              --jq '.behind_by // empty') || continue
            [ "${behind}" = 0 ] || continue
            echo "::notice::#${number} already carries this exact change, is up to date with main and has the same review state; opening nothing."
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
            exit 0
          done 3< "${RUNNER_TEMP}/candidates.tsv"
          echo 'skip=false' >> "${GITHUB_OUTPUT}"

      # --match-head-commit holds only at arming time: a commit pushed to the
      # branch afterwards would merge under this run's verdict. The "Restrict
      # updates" ruleset on chore/lockfile-refresh-* is what stops that push,
      # so arming requires proof it is in force: an active update rule on this
      # branch name from a ruleset nobody may bypass. Rulesets stack, so one
      # such ruleset is enough. Anything less — no rule, a bypass list, or a
      # bypass list this token cannot read — is no proof, and the next step
      # leaves the pull request for a human. The ruleset read must itself
      # still list the update rule, so an edit between the two reads proves
      # nothing. The rules endpoint matches by name, so the branch need not
      # exist yet. Read-only; the token returns here for the same reason as
      # below.
      - name: Check the refresh branch is push-locked
        id: lock
        if: steps.diff.outputs.changed == 'true' && steps.same.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: chore/lockfile-refresh-${{ github.run_id }}
        run: |
          set -euo pipefail
          unproven() {
            echo "::warning::${BRANCH} is not proven push-locked: $1"
            { echo 'locked=false'; echo "why=$1"; } >> "${GITHUB_OUTPUT}"
            exit 0
          }
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BRANCH}" \
            --jq '[.[] | select(.type == "update") | .ruleset_id] | unique | .[]') \
            || unproven 'its rules could not be read.'
          [ -n "${ids}" ] || unproven 'no "Restrict updates" rule applies to it.'
          while IFS= read -r id; do
            if ok=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}" \
                --jq '.enforcement == "active"
                      and (.bypass_actors | type) == "array"
                      and (.bypass_actors | length) == 0
                      and any(.rules[]?; .type == "update")') \
              && [ "${ok}" = true ]; then
              echo 'locked=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done <<< "${ids}"
          unproven 'each ruleset restricting it is inactive, unreadable, or has bypass actors.'

      # No token is present in any step that produced what is being pushed;
      # RELEASE_TOKEN returns only for the ruleset check, the push, the pull
      # request, labelling and arming.
      - name: Push the branch and open the pull request
        id: pr
        if: steps.diff.outputs.changed == 'true' && steps.same.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: chore/lockfile-refresh-${{ github.run_id }}
          TITLE: ${{ steps.summary.outputs.title }}
          BODY: ${{ steps.summary.outputs.body }}
          MAJORS: ${{ steps.summary.outputs.majors }}
          REQUIRES_REVIEW: ${{ steps.floors.outputs.requires_review }}
          LOCKED: ${{ steps.lock.outputs.locked }}
          LOCK_WHY: ${{ steps.lock.outputs.why }}
        run: |
          set -euo pipefail
          # Fail closed before anything is pushed: an empty or non-numeric
          # count would make the `-gt` test below error, which `if` reads as
          # false — arming a refresh whose majors were never counted.
          case "${MAJORS}" in
            '' | *[!0-9]*)
              echo "::error::The summary step reported no valid major count ('${MAJORS}'); refusing to open the pull request."
              exit 1
              ;;
          esac
          # The same for the floor step's verdict: anything but an explicit
          # `false` must never read as "safe to arm".
          case "${REQUIRES_REVIEW}" in
            true | false) ;;
            *)
              echo "::error::The floor step reported no review decision ('${REQUIRES_REVIEW}'); refusing to open the pull request."
              exit 1
              ;;
          esac

          # The remote is credential-free by design, so the token is supplied
          # for this one command rather than left in .git/config for the whole
          # job. Actions masks it in the log.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --base main \
            --head "${BRANCH}" \
            --body "${BODY}"
          # From here on a replacement exists, so the supersede step below may
          # close older refreshes even if arming fails.
          echo 'opened=true' >> "$GITHUB_OUTPUT"

          # Routes the pull request to a human. REST rather than
          # `gh pr edit --add-label`, which goes through a GraphQL mutation
          # that also touches deprecated classic projects.
          label_for_review() {
            number="$(gh pr view "${BRANCH}" --repo "${GITHUB_REPOSITORY}" \
              --json number --jq .number)"
            gh label create needs-manual-review --repo "${GITHUB_REPOSITORY}" \
              --force --color D93F0B \
              --description 'Dependency update outside the auto-merge policy'
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" \
              -f 'labels[]=needs-manual-review' > /dev/null
          }

          # A pin that crossed a breaking boundary is a reviewed change, the
          # same rule the Dependabot auto-merge policy applies. The body
          # already lists every such pin; the label routes it to a human and
          # arming is skipped. Not an error: the refresh did its job.
          if [ "${MAJORS}" -gt 0 ]; then
            label_for_review
            echo "::notice::${MAJORS} pin(s) crossed a major; #${number} is labelled needs-manual-review and not armed."
            exit 0
          fi

          # A floor younger than the release-age window or outside its locked
          # line, or an advisory no floor could clear, is a reviewed change
          # too (ADR-0003). The body says which; the label routes it.
          if [ "${REQUIRES_REVIEW}" = true ]; then
            label_for_review
            echo "::notice::An override floor needs review or an advisory is unresolved; #${number} is labelled needs-manual-review and not armed."
            exit 0
          fi

          # Without proof the branch is push-locked, an armed refresh could
          # merge a commit nobody judged. Left for a human and red, because a
          # missing or weakened ruleset is a setting to restore.
          if [ "${LOCKED}" != true ]; then
            label_for_review
            echo "::error::#${number} is not armed: ${BRANCH} is not proven push-locked (${LOCK_WHY:-the check did not report}). Restore the ruleset described under \"Lockfile refresh guard\" in docs/architecture/ci-pipeline.md, then merge it by hand."
            exit 1
          fi

          # Armed with RELEASE_TOKEN, not GITHUB_TOKEN: a merge performed by
          # GITHUB_TOKEN raises no `push` event, so release-please would never
          # see a runtime refresh land on main. --match-head-commit arms only
          # the exact commit this run produced: if anything else reached the
          # branch first, arming fails loudly instead of adopting it. The retry
          # covers GitHub still computing the new pull request's merge state.
          # The check holds only at arming time. A later push to the branch
          # is blocked by the "Restrict updates" ruleset the lock step proved
          # in force, and lockfile-refresh-guard.yml disarms it best effort
          # after the fact.
          head_sha="$(git rev-parse HEAD)"
          armed=false
          for attempt in 1 2 3; do
            if gh pr merge "${BRANCH}" --repo "${GITHUB_REPOSITORY}" \
              --auto --squash --match-head-commit "${head_sha}"; then
              armed=true
              break
            fi
            echo "::warning::Arming auto-merge failed (attempt ${attempt}/3); retrying."
            sleep 15
          done
          if [ "${armed}" != true ]; then
            echo "::error::Could not arm auto-merge on ${BRANCH}; it stays open for a manual merge."
            exit 1
          fi

      # One open refresh at a time keeps the queue honest, but skipping while
      # one is open (the previous behaviour) stalls auto-merge for good: main
      # requires branches to be up to date, so a refresh that falls behind can
      # never merge, and updating its branch would merge two lockfiles rather
      # than regenerate one — usually a conflict. A refresh still open a week
      # later is stale by definition, so it is closed here.
      #
      # This runs last on purpose. Closing first would leave nothing open if
      # any step after it failed — a canonical-check failure or a refused push
      # would silently retire last week's refresh with no replacement. So a
      # stale refresh is closed only once its replacement exists
      # (`opened == 'true'`), or once this run proved main already carries
      # every pin (`changed == 'false'`), which makes the stale one redundant.
      # That proof needs the floor planner to have finished with no rejection
      # (`complete`): a planner that failed, or rejected an advisory, carried
      # no floor for it, so `changed == 'false'` would say nothing about an
      # open refresh that carries one, and closing it would leave main red
      # with no remedy in flight. The replacement path needs no such proof:
      # gating it too would let stale refreshes pile up for as long as an
      # advisory has no fixed release.
      # `!cancelled()` keeps the close after a replacement whose arming failed:
      # the new pull request still supersedes the old one.
      # The token is safe here: `--package-lock-only` never installed or ran
      # third-party code in this job.
      - name: Supersede stale refresh pull requests
        if: >-
          !cancelled()
          && ((steps.diff.outputs.changed == 'false' && steps.floors.outputs.complete == 'true')
              || steps.pr.outputs.opened == 'true')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: chore/lockfile-refresh-${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,headRefName,isCrossRepository > "${RUNNER_TEMP}/open.json"
          # Same-repository branches only: a fork can name its branch anything,
          # and this step must never close a contributor's pull request. The
          # branch this run opened is excluded by name.
          jq -r --arg current "${BRANCH}" '.[]
            | select((.isCrossRepository | not)
                and (.headRefName | startswith("chore/lockfile-refresh-"))
                and (.headRefName != $current))
            | .number' "${RUNNER_TEMP}/open.json" > "${RUNNER_TEMP}/stale.txt"
          while IFS= read -r number; do
            [ -n "${number}" ] || continue
            gh pr close "${number}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
              --comment "Superseded by lockfile-refresh run ${GITHUB_RUN_ID}, which regenerated from current main."
            echo "::notice::Closed stale lockfile refresh #${number}."
          done < "${RUNNER_TEMP}/stale.txt"
