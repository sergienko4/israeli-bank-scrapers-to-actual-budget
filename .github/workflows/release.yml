name: Docker Build & Publish

# Three jobs:
#   prepare  resolves what this run publishes (a pushed tag, a republished
#            tag, or a rehearsal) and checks the tag against the manifest.
#   build    builds each architecture natively on its own runner, pushes it
#            to GHCR untagged (by digest), and runs the image smoke test on
#            that exact candidate. Nothing is tagged yet.
#   publish  runs only when both candidates passed: it joins the two digests
#            into one tagged multi-arch index, then mirrors to Docker Hub and
#            writes the SBOM and release notes.
# A rehearsal (workflow_dispatch with rehearsal=true) runs the same build and
# smoke legs from the dispatched commit and tags the result only as GHCR
# `:rehearsal`; every step that needs the Docker Hub or release secrets is
# skipped.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to republish (e.g., v1.9.0). Ignored when rehearsal is true.'
        required: false
        default: ''
      rehearsal:
        description: 'Build and smoke test both architectures, then tag only GHCR :rehearsal.'
        type: boolean
        default: false

# Each job widens this default only as far as it needs.
permissions:
  contents: read

env:
  DOCKER_IMAGE: sergienko4/israeli-bank-importer
  GHCR_IMAGE: ghcr.io/sergienko4/israeli-bank-importer

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
      ref: ${{ steps.mode.outputs.ref }}
      overlay: ${{ steps.mode.outputs.overlay }}

    steps:
      # tag-push  : the release-please tag; builds and publishes that tag.
      # republish : workflow_dispatch with a tag; rebuilds that tag's image
      #             content with this commit's CI tooling (see the overlay).
      # rehearsal : workflow_dispatch with rehearsal=true; builds this commit
      #             and publishes nothing but GHCR :rehearsal.
      - name: Resolve release mode
        id: mode
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_REHEARSAL" = "true" ]; then
            mode=rehearsal version=rehearsal ref="$GITHUB_SHA" overlay=false
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid tag format: '${INPUT_TAG}' (expected v1.2.3)"
              exit 1
            fi
            mode=republish version="$INPUT_TAG" ref="$INPUT_TAG" overlay=true
          else
            mode=tag-push version="$GITHUB_REF_NAME" ref="$GITHUB_REF" overlay=false
          fi
          {
            echo "mode=${mode}"
            echo "version=${version}"
            echo "ref=${ref}"
            echo "overlay=${overlay}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release mode ${mode}: ${version} from ${ref}"

      - name: Checkout code
        id: checkout
        if: steps.mode.outputs.mode != 'rehearsal'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.mode.outputs.ref }}
          persist-credentials: false

      - name: Verify tag matches manifest
        id: manifest
        if: steps.mode.outputs.mode != 'rehearsal'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          MANIFEST_VERSION=$(jq -r '.["."]//"unknown"' config/release-please/manifest.json)
          if [ "$VERSION" != "v${MANIFEST_VERSION}" ]; then
            echo "::error::Tag $VERSION does not match manifest v${MANIFEST_VERSION}"
            exit 1
          fi

      - name: Verify CHANGELOG entry
        id: changelog
        if: steps.mode.outputs.mode != 'rehearsal'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          BARE="${VERSION#v}"
          if ! grep -q "## \[${BARE}\]" CHANGELOG.md; then
            echo "::warning::No CHANGELOG entry for ${BARE}"
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One failed architecture cancels the other: publish needs both.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # When republishing an old tag via workflow_dispatch, actions/checkout
      # above rewinds the worktree to that tag — which may pre-date changes
      # to local composite actions in .github/actions/. The active workflow
      # file (release.yml) is loaded from the workflow run's commit
      # (github.sha), NOT the checked-out tag, so it can reference inputs
      # that don't exist in the historical composite. Overlay .github/actions/
      # from the WORKFLOW COMMIT (github.sha) so the workflow file and the
      # composite actions it references are guaranteed to be from the same
      # commit — deterministic even if main advances mid-run. Image content
      # (Dockerfile, src, deps) is still from the requested tag; only the
      # CI tooling is refreshed. Grep assertions fail fast if the overlay
      # didn't deliver the composite schema this job relies on.
      - name: Overlay workflow CI tooling (republish only)
        id: overlay
        if: needs.prepare.outputs.overlay == 'true'
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          git cat-file -e "${TOOLING_SHA}^{commit}" 2>/dev/null \
            || git fetch --depth=1 origin "${TOOLING_SHA}"
          git checkout "${TOOLING_SHA}" -- .github/actions/
          grep -qE '^  push-by-digest:' .github/actions/docker/build-image/action.yml \
            || { echo "::error::Overlay missing 'push-by-digest' input — composite schema unexpected"; exit 1; }
          grep -qE '^  digest:' .github/actions/docker/build-image/action.yml \
            || { echo "::error::Overlay missing 'digest' output — composite schema unexpected"; exit 1; }
          echo "::notice::Overlaid .github/actions/ from workflow commit ${TOOLING_SHA}"

      - name: Login to GHCR
        id: login_ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: ${{ needs.prepare.outputs.version }}

      # The candidate is pushed untagged: nobody can pull it by tag until
      # publish joins both architectures, so a failed smoke test never
      # reaches users.
      - name: Build and push the candidate by digest
        id: build
        uses: ./.github/actions/docker/build-image
        with:
          tag: ${{ env.GHCR_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.arch }}
          push-by-digest: 'true'
          load: 'false'

      - name: Pull the candidate for the smoke test
        id: candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build reported no valid image digest: '${DIGEST}'"
            exit 1
          fi
          docker pull "${GHCR_IMAGE}@${DIGEST}"
          docker tag "${GHCR_IMAGE}@${DIGEST}" israeli-bank-importer:e2e
          docker image inspect israeli-bank-importer:e2e > /dev/null

      # Tags built before the image contents E2E existed (every tag up to
      # v1.43.8) get the older createScraper check instead, and that check
      # needs no host npm install.
      - name: Detect the smoke test this tag supports
        id: smoke_mode
        run: |
          if [ -f tests/e2e/image-contents.e2e.test.ts ] && [ -f config/vitest.config.e2e.ts ]; then
            echo "mode=modern" >> "$GITHUB_OUTPUT"
          else
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for the smoke test
        id: setup
        if: steps.smoke_mode.outputs.mode == 'modern'
        uses: ./.github/actions/ci/setup

      - name: Smoke test the candidate (image contents E2E)
        id: smoke
        if: steps.smoke_mode.outputs.mode == 'modern'
        run: npx vitest run --config config/vitest.config.e2e.ts tests/e2e/image-contents.e2e.test.ts

      - name: Smoke test the candidate (legacy scraper API check)
        id: smoke_legacy
        if: steps.smoke_mode.outputs.mode == 'legacy'
        run: |
          echo "::warning::This tag predates the image contents E2E; only the scraper API is checked."
          docker run --rm --cap-add SYS_ADMIN israeli-bank-importer:e2e \
            node --input-type=module -e "
              import { createScraper } from '@sergienko4/israeli-bank-scrapers';
              const s = createScraper({ companyId: 'hapoalim', startDate: new Date() });
              if (typeof s.scrape !== 'function') {
                throw new Error('Scraper API broken: .scrape() missing');
              }
              console.log('Scraper API smoke test passed');
            "

      - name: Report the candidate's compressed layers and free disk
        id: layers
        if: always() && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          df -h /
          raw=$(docker buildx imagetools inspect "${GHCR_IMAGE}@${DIGEST}" --raw) || exit 0
          platform=$(jq -r --arg arch "$ARCH" '[.manifests[]? | select(.platform.architecture == $arch) | .digest][0] // empty' <<<"$raw")
          if [ -n "$platform" ]; then
            raw=$(docker buildx imagetools inspect "${GHCR_IMAGE}@${platform}" --raw) || exit 0
          fi
          jq -r '.layers[]? | "\(.size)\t\(.digest)"' <<<"$raw"
          jq -r '"Compressed total: \([.layers[]?.size] | add // 0) bytes"' <<<"$raw"

      - name: Record the candidate digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the candidate digest
        id: upload_digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      # sbom-action attaches its SBOM to the release with the job token.
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          # The release notes count commits since the previous tag.
          fetch-depth: 0

      - name: Login to GHCR
        id: login_ghcr
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # Best-effort: missing/invalid DOCKERHUB_* secrets must NOT fail the
        # release. The Docker Hub push step is also continue-on-error, so the
        # release still publishes to GHCR even when Docker Hub auth fails.
        id: login_dockerhub
        if: needs.prepare.outputs.mode != 'rehearsal'
        continue-on-error: true
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta_ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: ${{ needs.prepare.outputs.version }}

      - name: Download the candidate digests
        id: digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Check both candidate digests arrived
        id: digest_count
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${RUNNER_TEMP}"/digests/*)
          count=0
          for path in "${files[@]}"; do
            if [[ -f "$path" && "${path##*/}" =~ ^[0-9a-f]{64}$ ]]; then count=$((count + 1)); fi
          done
          # The index step joins every file here, so a stray file must fail too.
          if [ "${#files[@]}" -ne 2 ] || [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count} among ${#files[@]} files"
            exit 1
          fi

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # GHCR is the primary, REQUIRED publish target. This is the only step
      # that writes a tag; everything before it is untagged.
      - name: Tag the multi-arch index on GHCR
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta_ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tag_args+=(-t "$tag"); fi
          done <<<"$TAGS"
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "::error::metadata-action produced no GHCR tag"
            exit 1
          fi
          sources=()
          for digest in *; do sources+=("${GHCR_IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      # Docker Hub is the secondary, BEST-EFFORT target. Failure here does NOT
      # fail the release — users can pull from GHCR.
      #
      # Why regctl instead of a second buildx push:
      # Docker Hub's HAProxy edge proxy was rejecting BuildKit's multi-arch
      # parallel layer uploads with `400 Bad request: Your browser sent an
      # invalid request`, breaking v1.38.1 publish across 4 attempts. BuildKit
      # finalizes blob uploads with a long `?_state=<base64 token>&digest=...`
      # query string AND opens multiple concurrent PUT connections per
      # platform, which together trip Docker Hub's WAF.
      #
      # regctl uses a plain, sequential per-blob PUT/PATCH protocol — the
      # request shape registries have always expected — and reuses the bytes
      # already on GHCR (no rebuild, no Camoufox download).
      # Both Docker logins above wrote credentials to ~/.docker/config.json,
      # which regctl reads natively, so no extra secret plumbing is needed.
      #
      # Cross-registry blob mount is not supported by Docker Hub free tier, so
      # regctl streams the bytes (~1 GB multi-arch) from GHCR to DH via the
      # runner. That's fine — it takes about a minute and only runs after a
      # successful GHCR push, so we never burn CI minutes on a failed build.
      - name: Install regctl
        id: install_regctl
        if: needs.prepare.outputs.mode != 'rehearsal'
        # Pinned by version + SHA-256 for supply-chain safety. Direct download
        # from the official regclient/regclient release avoids depending on a
        # third-party installer action.
        env:
          REGCTL_VERSION: v0.11.5
          REGCTL_SHA256: c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/regctl \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  /tmp/regctl" | sha256sum -c -
          install -m 0755 /tmp/regctl /usr/local/bin/regctl
          rm -f /tmp/regctl
          regctl version

      - name: Promote image from GHCR to Docker Hub via regctl
        id: push_dockerhub
        if: needs.prepare.outputs.mode != 'rehearsal'
        continue-on-error: true
        # `regctl image copy` preserves the multi-arch manifest list, all
        # platform manifests, and all referenced blobs. The destination tag on
        # Docker Hub ends up byte-identical to the GHCR source.
        run: |
          set -euo pipefail
          SRC="${GHCR_IMAGE}:${VERSION}"
          DST="${DOCKER_IMAGE}:${VERSION}"
          echo "::notice::Promoting ${SRC} → ${DST}"
          regctl image copy --digest-tags "${SRC}" "${DST}"
          echo "::group::Verify destination manifest"
          regctl manifest get "${DST}"
          echo "::endgroup::"

      - name: Warn if Docker Hub push failed
        id: dockerhub_warning
        if: needs.prepare.outputs.mode != 'rehearsal' && steps.push_dockerhub.outcome == 'failure'
        run: |
          echo "::warning::Docker Hub push failed for ${VERSION} — image is published only to GHCR (${GHCR_IMAGE}:${VERSION})"

      - name: Generate SBOM
        id: sbom
        if: needs.prepare.outputs.mode != 'rehearsal'
        # Generate SBOM from the GHCR image (always available since GHCR push
        # is required). Anchore pulls the image to scan it; using GHCR avoids
        # any Docker Hub dependency in the SBOM path.
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ needs.prepare.outputs.version }}.spdx.json

      - name: Build enriched release notes
        id: notes
        if: needs.prepare.outputs.mode != 'rehearsal'
        env:
          # Surface the Docker Hub push outcome to the bash script so the
          # release notes only advertise the Docker Hub URL when the mirror
          # actually published. Otherwise users get a 404 from `docker pull`.
          DOCKERHUB_OUTCOME: ${{ steps.push_dockerhub.outcome }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count "${PREV_TAG}..${VERSION}")
            FILES_CHANGED=$(git diff --name-only "${PREV_TAG}..${VERSION}" | wc -l | tr -d ' ')
            SHORTSTAT=$(git diff --shortstat "${PREV_TAG}..${VERSION}")
            LINES_ADDED=$(echo "$SHORTSTAT" | grep -oP '\d+(?= insertions?)' || echo "0")
            LINES_DELETED=$(echo "$SHORTSTAT" | grep -oP '\d+(?= deletions?)' || echo "0")
            COMPARE_URL="https://github.com/sergienko4/israeli-bank-scrapers-to-actual-budget/compare/${PREV_TAG}...${VERSION}"
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            FILES_CHANGED="N/A"
            LINES_ADDED="N/A"
            LINES_DELETED="N/A"
            COMPARE_URL=""
          fi

          {
            echo "## Docker"
            echo ""
            if [ "$DOCKERHUB_OUTCOME" = "success" ]; then
              echo 'Multi-arch images (`linux/amd64`, `linux/arm64`) are published to two registries:'
              echo ""
              echo "**GHCR (primary, always available):**"
              echo ""
              echo '```bash'
              echo "docker pull ghcr.io/sergienko4/israeli-bank-importer:${VERSION}"
              echo '```'
              echo ""
              echo "**Docker Hub (mirror):**"
              echo ""
              echo '```bash'
              echo "docker pull sergienko4/israeli-bank-importer:${VERSION}"
              echo '```'
            else
              echo 'Multi-arch images (`linux/amd64`, `linux/arm64`) are published to GHCR:'
              echo ""
              echo '```bash'
              echo "docker pull ghcr.io/sergienko4/israeli-bank-importer:${VERSION}"
              echo '```'
              echo ""
              echo "_Docker Hub mirror push did not succeed for this release — pull from GHCR above._"
            fi
            echo ""

            echo "## Commits"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${VERSION}" --pretty=format:"- %s (%h)"
            else
              git log --pretty=format:"- %s (%h)" -10
            fi
            echo ""
            echo ""

            echo "## Release Statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Commits | ${COMMIT_COUNT} |"
            echo "| Files changed | ${FILES_CHANGED} |"
            echo "| Lines added | +${LINES_ADDED} |"
            echo "| Lines deleted | -${LINES_DELETED} |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo ""

            echo "---"
            echo ""

            echo "## Quick Start"
            echo ""
            echo '```bash'
            echo "docker run -d \\"
            echo "  --name israeli-bank-importer \\"
            echo "  --cap-add=SYS_ADMIN \\"
            echo "  -v /path/to/config.json:/app/config.json:ro \\"
            echo "  -e SCHEDULE=\"0 9 * * *\" \\"
            echo "  -e TZ=Asia/Jerusalem \\"
            echo "  ghcr.io/sergienko4/israeli-bank-importer:${VERSION}"
            echo '```'
            echo ""

            echo "<details><summary>Docker Compose example</summary>"
            echo ""
            echo '```yaml'
            echo "services:"
            echo "  israeli-bank-importer:"
            echo "    image: ghcr.io/sergienko4/israeli-bank-importer:${VERSION}"
            echo "    restart: always"
            echo "    cap_add:"
            echo "      - SYS_ADMIN"
            echo "    volumes:"
            echo "      - ./config.json:/app/config.json:ro"
            echo "      - ./data:/app/data"
            echo "      - ./cache:/app/cache"
            echo "      - ./chrome-data:/app/chrome-data"
            echo "    environment:"
            echo "      - TZ=Asia/Jerusalem"
            echo "      - SCHEDULE=0 */8 * * *"
            echo '```'
            echo ""
            echo "</details>"
            echo ""

            echo "## Upgrading"
            echo ""
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""

            echo "---"
            echo ""

            echo "**Docs:** [README](https://github.com/sergienko4/israeli-bank-scrapers-to-actual-budget) | [Supported Banks](https://github.com/sergienko4/israeli-bank-scrapers-to-actual-budget/blob/main/docs/BANKS.md) | [Deployment Guide](https://github.com/sergienko4/israeli-bank-scrapers-to-actual-budget/blob/main/docs/DEPLOYMENT.md) | [GHCR](https://github.com/sergienko4/israeli-bank-scrapers-to-actual-budget/pkgs/container/israeli-bank-importer) | [Docker Hub](https://hub.docker.com/r/sergienko4/israeli-bank-importer)"
            echo ""

            if [ -n "$COMPARE_URL" ]; then
              echo "**Full Changelog:** ${COMPARE_URL}"
            fi
          } > enriched_notes.md

      - name: Attach SBOM and enrich release
        id: gh_release
        if: needs.prepare.outputs.mode != 'rehearsal'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          append_body: true
          body_path: enriched_notes.md
          files: sbom.spdx.json
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Update Docker Hub description
        id: dockerhub_description
        # Only attempt when the Docker Hub push itself succeeded — if the
        # registry is rejecting us, no point updating the description.
        # Marked best-effort so a Docker Hub API hiccup doesn't fail a
        # release whose images already published successfully.
        if: needs.prepare.outputs.mode != 'rehearsal' && steps.push_dockerhub.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE }}
          short-description: "Import transactions from 19 Israeli banks and credit cards into Actual Budget. Docker, TypeScript, Telegram bot."
          readme-filepath: ./README.docker-hub.md
