name: Lockfile Sync (postcss 8.5.18)

# One-shot, self-deleting workflow: regenerates package-lock.json on clean CI
# npm after the postcss override bump, then removes itself so the follow-up
# lockfile push cannot re-trigger it. Local npm is unavailable, so the lockfile
# must be regenerated here. Delete this file if it lingers after the sync commit.

on:
  push:
    branches: [fix/postcss-8.5.18-2026-07-24]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile with patched postcss
        run: npm install --no-audit --no-fund
      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high
      - name: Commit synced lockfile and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet .github/workflows/lockfile-sync-postcss.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Nothing to sync'
          else
            git commit -m 'chore(deps): sync lockfile to postcss 8.5.18'
            git push origin HEAD:fix/postcss-8.5.18-2026-07-24
          fi
