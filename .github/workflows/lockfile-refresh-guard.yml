name: Lockfile refresh guard

# Withdraws auto-merge from a lockfile refresh pull request after its branch
# moves, and routes it to a human. Best-effort defence in depth, not the
# preventive control.
#
# lockfile-refresh.yml arms squash auto-merge with --match-head-commit, so
# only the commit that run produced can be armed. That check runs once, at
# arming time. Auto-merge stays enabled when someone with write access moves
# the branch later, and a refresh needs no approving review, so a commit
# pushed after arming would merge unseen once the required checks pass.
# This workflow narrows that window: a push to an open refresh branch
# disarms it and labels it needs-manual-review, the same label a refresh
# that crosses a major receives.
#
# It reacts after the push, so it cannot close the window. A merge can win
# the race when the required checks finish first, or while Actions is down.
# The preventive control is a repository ruleset that applies "Restrict
# updates" to refs/heads/chore/lockfile-refresh-* with an empty bypass
# list. The refresh only creates new branches, which that rule does not
# restrict, and it arms only after reading that ruleset back through the API
# as active with no bypass actor; see "Lockfile refresh guard" in
# docs/architecture/ci-pipeline.md.
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets#restrict-updates
#
# The refresh run's own push never reaches this workflow. It pushes the
# branch before it opens the pull request, so no `synchronize` event exists
# for that commit. Every later push is foreign by definition, including a
# GitHub "Update branch" merge: the refresh is regenerated, never updated,
# so a moved branch is no longer the commit that was decided on. Next
# week's run supersedes it.
#
# Design decisions:
#
# 1. `pull_request_target`, not `pull_request`: the workflow definition comes
#    from the default branch, so a push to the refresh branch cannot edit or
#    remove the guard that judges it.
#    https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_target
# 2. Nothing is checked out and no pull-request code runs. The branch name is
#    read only in the job's `if:` expression, never inside `run:`.
#    https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
# 3. RELEASE_TOKEN for every write, the token that armed the pull request.
#    GITHUB_TOKEN gets no permissions here.
#
# Limit: a push made with a workflow's GITHUB_TOKEN raises no event, so this
# guard cannot see one. No workflow in this repository pushes to a refresh
# branch with GITHUB_TOKEN.
#
# On error: the state is re-read and the disable retried three times. If
# disarming still cannot be confirmed, the pull request is labelled anyway
# and the run fails red so a human sees it. It never arms anything.

on:
  pull_request_target:
    types: [synchronize]

permissions: {}

jobs:
  disarm:
    name: Disarm a moved lockfile refresh
    # Same-repository refresh branches only. A fork cannot push to the
    # refresh branch, and its pull requests are never armed.
    if: >-
      startsWith(github.head_ref, 'chore/lockfile-refresh-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: lockfile-refresh-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      HUSKY: 0
    steps:
      - name: Withdraw auto-merge and request a human review
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Same routine as the helper in dependabot-auto-merge.yml. One API
          # blip must not leave the arming in place: the state is re-read and
          # the disable retried, and an answer that is neither true nor false
          # counts as still armed. Success is a read of `false` or a disable
          # call that the API accepted.
          was_armed=unknown
          disarm() {
            local i armed
            for i in 1 2 3; do
              if armed=$(gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" \
                --json autoMergeRequest --jq '.autoMergeRequest != null'); then
                case "${armed}" in
                  false)
                    if [ "${was_armed}" = unknown ]; then was_armed=false; fi
                    return 0
                    ;;
                  true)
                    was_armed=true
                    if gh pr merge "${PR}" --repo "${GITHUB_REPOSITORY}" \
                      --disable-auto; then
                      return 0
                    fi
                    ;;
                esac
              fi
              sleep $((i * 5))
            done
            echo "::error::#${PR}: could not confirm auto-merge is disarmed."
            return 1
          }
          disarmed=true
          if ! disarm; then disarmed=false; fi

          # Labelled even when disarming failed, so a human still sees it.
          # REST rather than `gh pr edit --add-label`, which goes through a
          # GraphQL mutation that also touches deprecated classic projects.
          gh label create needs-manual-review --repo "${GITHUB_REPOSITORY}" \
            --force --color D93F0B \
            --description 'Dependency update outside the auto-merge policy'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" \
            -f 'labels[]=needs-manual-review' > /dev/null

          message="#${PR} moved after it was opened; labelled needs-manual-review (was armed: ${was_armed}, disarm confirmed: ${disarmed})."
          echo "::notice::${message}"
          echo "${message}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${disarmed}" != true ]; then
            exit 1
          fi
