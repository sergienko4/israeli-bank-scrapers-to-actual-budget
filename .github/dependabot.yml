version: 2
# Dependabot grouped weekly updates — dev tooling is batched into one PR
# so the bounded open-pull-requests-limit is never exhausted by low-risk
# churn. Production packages remain individually reviewable, except for
# the retained pino group below, which is the single deliberate
# exception. Dependabot owns ALL npm dependencies, including the
# critical @actual-app/api and @sergienko4/israeli-bank-scrapers packages.
# The previous daily dependency-check.yml workflow was retired: its
# `npm update` step could not cross major versions and crashed on the
# scraper's patch-package postinstall (added in 8.6.0), so scraper updates
# never reached this repo. patch-package is now a devDependency so the
# scraper's postinstall no-ops cleanly on install.

updates:
  # ── npm ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    # Every six hours, on every day of the week. NOT `daily`: GitHub defines
    # that interval as "run on every weekday, Monday to Friday", so it skips
    # Saturday and Sunday entirely. That is a silent two-day hole, and the
    # scraper falls into it. @sergienko4/israeli-bank-scrapers is the package
    # that breaks when a bank changes its site, and its releases are
    # overwhelmingly login/scrape fixes (8.6.2: "stop popup probe closing login
    # UI"). 8.6.5 published Saturday 2026-08-08 20:43Z; under `daily` the first
    # scan that could propose it was Monday 06:00 — the entire weekend with
    # scraping broken, which is precisely when an unattended import runs. Every
    # such gap so far has been closed by a hand-written bump PR (#554, #574,
    # #582, #585), which is the manual work this schedule exists to remove.
    # A six-hourly cron bounds the scan lag to ~6h on any day; the `cooldown`
    # block below removes the separate three-day eligibility delay, and both
    # are required before a release is proposed promptly. The dev-dependencies
    # group below keeps the extra frequency from becoming PR noise: dev churn
    # still lands as a single PR. Docker and Actions stay weekly — neither is
    # time-critical.
    #
    # The cron expression belongs to `cronjob`; `cron` is not a recognised key,
    # and the timezone must stay in `timezone` rather than inside the
    # expression. `time` applies only to the daily and weekly intervals, so it
    # is dropped here — the hour now comes from the expression itself.
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cronjob
    schedule:
      interval: cron
      cronjob: "0 */6 * * *"
      timezone: Asia/Jerusalem
    # The schedule above only controls how often Dependabot LOOKS. A second,
    # independent barrier controls what it is allowed to PROPOSE: Dependabot
    # applies a default cooldown of three days, so a release is invisible to a
    # version update until it is 72h old, no matter how often we scan. That
    # barrier is not theoretical — it is visible in this repository's own
    # history, where every recent bot PR landed just past the three-day mark
    # and none before it:
    #
    #   @actual-app/api 26.8.0  published 2026-08-02 20:40Z  ->  #584  +3d01h
    #   cron-parser     5.7.0   published 2026-08-01 18:09Z  ->  #580  +3d09h
    #   fastify         5.11.2  published 2026-08-03 08:21Z  ->  #592  +3d19h
    #   @biomejs/biome  2.5.7   published 2026-08-04 13:24Z  ->  #599  +4d08h
    #
    # biome is the clearest case: at the 2026-08-07 03:08Z scan it was 2d14h
    # old, missed the bar by ten hours and was skipped, then appeared at the
    # very next scan. The same rule — not a missed scan — is why scraper 8.6.5
    # was not proposed by the 2026-08-08 21:32Z run: it was 48 minutes old.
    #
    # Three days is a sound default for ordinary dependencies; it is a window
    # in which a compromised or broken release gets pulled before it ever
    # reaches us, so it is kept for everything else. It is the wrong trade for
    # this one package. A scraper release exists because a bank changed its
    # site and logins are already failing, so the cooldown holds back the fix
    # for the exact three days the importer is broken. Excluding it restores
    # the intended behaviour for every future release, not just the current
    # one. `default-days` is deliberately not set: leaving it unspecified keeps
    # whatever default GitHub applies for other packages, so this block can
    # only ever remove a delay, never introduce one.
    cooldown:
      exclude:
        - "@sergienko4/israeli-bank-scrapers"
    open-pull-requests-limit: 10
    labels: ["dependencies", "npm"]
    # Production dependencies ship inside the published Docker image, so a
    # bump changes what users actually run and MUST cut a release. `fix(deps)`
    # is release-please-triggering (patch); the previous `chore(deps)` prefix
    # was hidden from the changelog and produced no version bump, no tag and
    # no image publish — scraper bumps had to be retitled by hand (see
    # 91d959d, f5f39ec). Dev dependencies never reach the image, so they keep
    # a non-triggering prefix. `include: scope` is deliberately omitted: it
    # appended a second scope (`chore(deps)(deps):`), which the conventional
    # commit parser cannot read, so those commits were dropped entirely.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # TypeScript 7 (the native Go port) is rejected by two peers we depend
      # on, so `npm ci` fails with ERESOLVE before any CI job runs:
      #   typedoc@0.28.20            → typescript 5.0.x … 6.0.x
      #   typescript-eslint@8.64.0   → typescript >=4.8.4 <6.1.0
      # Neither ships TS 7 support on a stable release yet (only
      # typedoc@1.0.0-dev.4 does). Resolving it would need --legacy-peer-deps
      # or --force, which weakens the dependency gate. Drop this entry once
      # both peers publish stable TS 7 ranges. Minor/patch updates within the
      # supported major continue to be proposed.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Dev tooling churns weekly and used to consume every available PR
      # slot (5 open dev PRs at once), starving runtime dependencies such
      # as @sergienko4/israeli-bank-scrapers: its 8.6.1 release was never
      # proposed because no slot was free. Collapsing every devDependency
      # into a single PR keeps slots reserved for production packages.
      dev-dependencies:
        dependency-type: development
      # The one grouped production entry: pino and pino-pretty are both
      # runtime dependencies, and pino-pretty consumes pino's log format,
      # so they are bumped together to stop the logger and its transport
      # drifting apart. Every OTHER production package stays ungrouped so
      # it remains individually reviewable and revertible.
      pino:
        patterns:
          - "pino*"

  # ── Docker (Dockerfile base image) ──────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]
    # The base image IS the shipped runtime, so a bump must cut a release for
    # the same reason production npm dependencies do.
    commit-message:
      prefix: "fix(docker)"

  # ── GitHub Actions ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 2
    labels: ["dependencies", "github-actions"]
    # Workflow actions run in CI only and never ship to users, so these stay
    # non-triggering. `include: scope` is omitted here too — it produced the
    # unparseable `chore(ci)(deps):` double scope (see ce02193).
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-core:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
      codeql:
        patterns:
          - "github/codeql-action/*"
      security-actions:
        patterns:
          - "aquasecurity/*"
          - "anchore/*"
          - "SonarSource/*"
